description: >-
  Number of data-center records the Atlas of Data Center Politics lists for each of the 242 countries
  and territories of abf-boundaries, split by status and by size class. A record is counted under the
  country the Atlas lists it under, not by its point. 0 means that the Atlas lists no data-center record
  for the country; it does not mean that the country has no data centers. groups.csv gives the same
  counts for groups of countries (EU27).
