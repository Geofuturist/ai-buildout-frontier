- path: 'D:\GISData\AI\DC\out\abf-dc-v0.1.0\groups.csv'
  publish_as: groups.csv
  unique_column: group_id
  description: >-
    Counts of dc_atlas_count_adm0 summed for groups of countries. EU27: the 27 member states of the
    European Union. aggregate_state is complete when every member is covered.
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
  sample_share: {}
  method: >-
    Records are counted by script by the country under which the Atlas lists them. The build stops if the
    counts of the 242 units do not add up to the 9,865 records of the point layer. That the Atlas lists
    126 countries and territories was read by V on the Atlas site on 18 October 2026; V also checked that
    Malta and Libya, which are not in the list, have no records, and that Portugal has no Retired records
    (manual_checks.csv).
freshness:
  source_cadence: irregular
  next_check: "2027-01-31"
coverage:
  geography: "All 242 countries and territories of abf-boundaries v0.2.0"
  known_gaps:
  - >-
    The Atlas states that absence from it should not be read as evidence that a facility does not exist,
    and that its coverage is broad but uneven. 116 countries and territories have 0 records because the
    Atlas lists none for them.
  - >-
    Counts follow the Atlas rows: records identical in every field are counted separately, and a record
    is counted under the country the Atlas lists it under, also where its point falls in a neighboring
    country.
  - >-
    The one record the Atlas lists under Somaliland is counted under Somalia (SOM), because
    abf-boundaries has no separate unit for Somaliland. This follows the boundary frame and is not a
    position on its status.
  - "The Atlas gives Gibraltar as a first-level unit; its one record is counted under GIB, a unit of abf-boundaries."
  - >-
    The record in Simferopol, Crimea, is counted under Russia, as the Atlas lists it; abf-boundaries
    v0.2.0 shows Crimea under Russian control and records Ukraine's claim (contested_areas).
display:
  geometry_type: polygon
  map: false   # decision of V 25.10 (SPEC_DC_world_v0_2_0 r5 section 9 item 5): the country count is not drawn as a map layer
  value_field: n_records
  unit: records
  zero_class: true
  breaks_fixed: true
  breaks: [1, 10, 100, 1000]  # SPEC_DC r8 section 15 (ARCH6, 23.10); zero_class is a separate class
  tile_fields: [n_records, n_operating_or_construction, n_planned, n_retired, n_class_lt10, n_class_10_99, n_class_100_999, n_class_ge1000, n_class_unknown]
tiles:
  minzoom: 0
  maxzoom: 6
