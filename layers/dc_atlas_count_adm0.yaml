- name: n_class_100_999
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Hyperscale (100–999 MW)."
- name: n_class_ge1000
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Gigascale (above 999 MW)."
- name: n_class_unknown
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Unknown."
