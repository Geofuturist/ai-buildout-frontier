freshness:
  source_cadence: discontinued
  next_check: null
coverage:
  geography: Contiguous United States and the District of Columbia
  known_gaps:
  - Alaska and Hawaii are not covered.
  - HIFLD Open, the public portal that distributed this file, was discontinued by the U.S. Department of Homeland Security
    on 26 August 2025; the announcement gave no reason. The layer uses an archived copy of the national file (copy of 26
    February 2026; newest record 26 September 2024). Other public archives of the file exist, for example DataLumos (DOI
    10.3886/E240591V1); which archive our copy came from was not recorded, and it has not been matched to them record by
    record.
  - 'A state''s kilometers are rounded once from unrounded county lengths, so they can differ from the sum of the rounded
    county values: by up to 12 km in one state and by 32 km over all 49 covered units. state_reconciliation.csv lists the
    differences.'
  - 1,444.6 km of line in the contiguous United States lie in no county polygon of the Census 1:500,000 file, over water
    beyond its coastline or across the national border, and are in neither the county nor the state values.
  - The layer does not show how much power can flow into a state.
  - The archive carries no dataset metadata; license status is taken from the publisher's metadata for the same edition
    (30 Sep 2024).
verification:
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  method: Line lengths are taken from the same cut of the segments by county polygons as in the county layer, added up by
    state before rounding, and classed by voltage. The same run recomputed the county layer and matched the published values
    of version 0.1.0 in every county. For each state and class the build checked the state value against the sum of its
    rounded county values, within the rounding tolerance of 0.5 km per county. No value was re-checked by a person or by
    an agent. The automated checks listed below were run on every build.
  sample_share: {}
checks:
  km_total_matches_has_any_line: true
display:
  geometry_type: polygon
  value_field: km_total
  unit: km
  breaks:
  - 8000
  - 15000
  - 20000
  - 25000
  zero_class: false
  legend_title: Transmission line length in the state, km
  series: Transmission lines · HIFLD
  tile_fields:
  - unit_id
  - name
  - coverage_status
  - coverage_note
  - has_any_line
  - max_voltage_kv
  - km_total
tiles:
  minzoom: 0
  maxzoom: 10
