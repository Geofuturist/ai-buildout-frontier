- name: km_v230
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state, class 230 kV, rounded to whole kilometers. 0 means no such line.
- name: km_v138
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state, class 138 kV, rounded to whole kilometers. 0 means no such line.
- name: km_v115
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state, class 115 kV, rounded to whole kilometers. 0 means no such line.
- name: km_v69
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state, class 69 kV, rounded to whole kilometers. 0 means no such line.
- name: km_lt69_unknown
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state with a class below 69 kV or without a recorded voltage, rounded to whole kilometers.
    0 means no such line.
- name: km_total
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Sum of the published km columns (km_ge765 to km_lt69_unknown). Each column is rounded once, after the unrounded
    lengths of the state's counties are added up.
