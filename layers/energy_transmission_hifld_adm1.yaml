# Layer config: transmission lines, HIFLD, state level. Texts: RES_texts_USA_states_v0_2_0.md r1 section 5.
# The source archive and the rights check are on the layers of segments and counties; this layer does not publish the archive again.
layer_id: energy_transmission_hifld_adm1
title: Transmission lines · HIFLD · state
title_ru: ЛЭП · HIFLD · штаты
domain: energy
level: ADM1
frame:
  iso3: USA
  level: ADM1
  code_regex: \d{2}
  service_fields:
  - unit_id
  - name
  - coverage_status
  - coverage_note
  outside_note: 'Not processed: this release covers only the contiguous United States and the District of Columbia.'
input:
  table: data\conus\layer_transmission_hifld_adm1_20261107.csv
  key: unit_id
  legacy_meta: data\conus\layer_transmission_hifld_adm1_meta.json
  coverage_column: coverage_status
  coverage_note_column: coverage_note
  coverage_note_text: 'Not processed: this release covers only the contiguous United States and the District of Columbia.'
description: Kilometers of transmission line inside each state by voltage class, their sum, the highest voltage present,
  and whether the state has any line. The length of a state is the length inside its counties, added up before rounding;
  a line that crosses a boundary is counted only for the part inside. Alaska and Hawaii are not covered and have empty values.
fields:
- name: max_voltage_kv
  type: number
  unit: kV
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: None of the state's lines has a recorded voltage.
  description: Highest voltage among the lines inside the state that have a recorded voltage (the highest of its counties'
    values).
- name: has_any_line
  type: boolean
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: True if at least one line of the source file touches a county of the state.
- name: frac_km_unknown_voltage
  type: number
  unit: share
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: The state has no line length inside it, so the share is undefined.
  description: Share of the line length inside the state that has no recorded voltage, from 0 to 1.
- name: km_ge765
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state, class 735 kV and above, rounded to whole kilometers. 0 means no such line.
- name: km_v500
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
    covered: null
  description: Line length inside the state, class 500 kV, rounded to whole kilometers. 0 means no such line.
- name: km_v345
  type: integer
  unit: km
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii, which this release does not cover; it was not processed.
