# Layer config: interconnection queue, LBNL Queued Up 2026 edition, county level.
layer_id: energy_queue_lbnl_adm2
title: "Interconnection queue · LBNL Queued Up · county"
title_ru: "Очередь на подключение · LBNL Queued Up · округа"
domain: energy
level: ADM2
frame: {iso3: USA, level: ADM2}
input:
  # Built by [CODE-PILOT] on 2026-10-09 from lbnl_ix_queue_data_file_thru2025.xlsx (file with _r2; the
  # file without _r2 is an intermediate one and must not be used).
  table: 'data\conus\layer_queue_lbnl_20261009_r2.csv'
  key: fips
  legacy_meta: 'data\conus\layer_queue_lbnl_20261009_r2_meta.json'
  coverage_column: coverage_status        # per-row coverage given by the table (Connecticut = not_covered)
  coverage_note_column: coverage_note     # goes to the report only, not published as a field
description: >-
  Capacity of the active interconnection requests in the Queued Up database (2026 edition), summed
  by county, with the number of those projects. A county with no active request in the file has the
  value 0. Alaska and Hawaii, and the nine Connecticut planning regions, are not covered and have empty values.
fields:
  - name: queue_mw_active
    type: number
    unit: MW
    nullable: true
    null_meaning:
      not_covered: "The unit is outside the contiguous United States and the District of Columbia and was not processed, or it is one of the nine Connecticut planning regions: the source codes Connecticut projects by the pre-2022 counties, which do not map onto the 2022 planning regions."
      covered: null
    description: "Capacity of the active interconnection requests located in the county. 0 means there is no active project in the queue file for this county."
    fill_na_covered: 0
    min: 0
  - name: n_active_projects
    type: integer
    nullable: true
    null_meaning:
      not_covered: "The unit is outside the contiguous United States and the District of Columbia and was not processed, or it is one of the nine Connecticut planning regions: the source codes Connecticut projects by the pre-2022 counties, which do not map onto the 2022 planning regions."
      covered: null
    description: "Number of active interconnection requests in the county. 0 means none are in the queue file."
    fill_na_covered: 0
    min: 0
