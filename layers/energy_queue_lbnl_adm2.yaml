freshness: {source_cadence: annual, next_check: "2027-06-30"}
coverage:
  geography: "Contiguous United States and the District of Columbia"
  known_gaps:
    - "Alaska and Hawaii are not covered."
    - "The nine Connecticut planning regions (09110-09190) are not covered: the source codes Connecticut projects by the pre-2022 counties, which do not map onto the 2022 planning regions. Seven active Connecticut requests (678.2 MW) are not in the layer."
    - "Eleven active requests with capacity of zero or less (-193.5 MW in total) are excluded. Ten of them lie in the contiguous United States: MISO L002, L003, L004, L006, L008, L009 and ERCOT 18INR0064, 19INR0120, 20INR0019, 24INR0372. The reason for the negative values is not checked against the source codebook."
    - "35 active requests in states of the contiguous United States have no county code (11,280.7 MW) and are not in the county values."
    - "53 active requests located in other states or territories, or with no state given (8,813.0 MW), are not in the layer."
    - "The queue changes continuously; the file is a snapshot of requests as reported by grid operators and utilities."
verification:
  levels: {source_as_is: 0.0, script_rules: 1.0, human: 0.0}
  method: >-
    Active requests are summed by county by script from the source workbook. No value was
    re-checked by a person or by an agent. The automated checks listed below were run on every
    build.
  sample_share: {}
checks:
  totals_vs_source:
    # Rule of [CODE-PILOT]: active; project MW = max(mw1, mw2, mw3) over numeric values; MW <= 0 excluded.
    # Expected: 8513 active = 8407 in the layer + 89 without county code + 7 Connecticut + 10 with MW <= 0.
    source_file: 'D:\GISData\Energy\USA\lbnl_ix_queue_data_file_thru2025.xlsx'
    sheet: "03. Complete Queue Data"
    header_row: 1
    status_column: q_status
    status_value: active
    state_column: state
    mw_column: [mw_1, mw_2, mw_3]
    mw_mode: max
    exclude_nonpositive: true
    layer_column: queue_mw_active
    states: [AL, AR, AZ, CA, CO, CT, DC, DE, FL, GA, ID, IL, IN, IA, KS, KY, LA, MA, MD, ME, MI, MN, MO, MS, MT, NC, ND, NE, NH, NJ, NM, NV, NY, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VA, VT, WA, WI, WV, WY]
    code_column: fips_code
    count_column: n_active_projects
    # Disjoint categories, in this order ([ARCH] 09.10); what is left must equal the layer.
    derived_exceptions:
      - {name: "capacity zero or less", nonpositive: true}
      - {name: "state outside the contiguous US or not given", outside_states: true}
      - {name: "contiguous US state, no county code", empty_code: true}
      - {name: "Connecticut, pre-2022 county codes", states: [CT]}
display:
  geometry_type: polygon
  value_field: queue_mw_active
  unit: MW
  breaks: [150, 300, 600, 1250]
  zero_class: true
  legend_title: "Active queue capacity, MW"
  tile_fields: [unit_id, name, coverage_status, queue_mw_active, n_active_projects]
tiles: {minzoom: 0, maxzoom: 10}
citation:
  text: "AI Buildout Frontier. {title}. Version {version}, {year}. {doi_url}"
  record_pattern: "AI Buildout Frontier, layer {layer_id}, unit {record_key}, version {version}. {doi_url}"
