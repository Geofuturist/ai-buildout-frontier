verification:
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
    agent_sample: 0.0
  sample_share: {}
  method: 'The units are selected by script from the sheet Power facilities of the GEM file with the stated SHA-256: a unit
    belongs here if its Other IDs (unit/phase) contain an identifier that begins with TZ: (for example TZ: 984606), which
    GEM''s About sheet calls a “TZ ID”. The build stops unless the rule selects 18,732 units with 84,304 MW, as counted
    before the build in GEM''s Global Solar Power Tracker, which the integrated tracker includes. All other checks are those
    of energy_plants_gem_units. A second run gives byte-identical files. The project did not check the records against TZ-SAM
    or other sources: the values are GEM''s.'
freshness:
  source_cadence: irregular
  next_check: '2027-01-31'
coverage:
  geography: Solar plants of the world (GEM / TransitionZero)
  iso3_from: iso3_source
  known_gaps:
  - 'These are only the TZ-SAM records that GEM took into its tracker, not TZ-SAM as published by TransitionZero. GEM''s
    solar threshold applies: 1 MW for operating projects, more than 20 MW for projects not yet operating. The GEM solar
    tracker in this release is of February 2026.'
  - '18,730 units are operating, 1 is in pre-construction and 1 is cancelled. All are 20 MW or less: 16,643 are under 10
    MW and 2,089 from 10 to 20 MW.'
  - GEM names an owner for 72 of the 18,732 units and an operator for 60. For 18,584 units GEM gives the technology as “Assumed
    PV”.
  - 18,704 units are given in MWac, 3 in MWp/dc and 25 with unknown basis (capacity_rating).
  - GEM gives an approximate location for 426 units (2.3%).
  - The country is given by GEM's table and by the point. 173 units lie outside the generalized country outlines but within
    22.2 km of a country and get the nearest one. For 102 units the point lies in another country of the frame than the
    one GEM names; some lie near borders, where generalized outlines can put a point across the line. Neither is a position
    of the project.
  - 15 plants have units in both datasets; their other units are in abf-energy (CC BY 4.0).
