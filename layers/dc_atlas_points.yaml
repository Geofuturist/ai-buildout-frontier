  - address_raw
  - iso3_source
  - iso3_frame
  - control_iso3
ref_field: ref
tiles:
  minzoom: 0
  maxzoom: 12
  # About 6,100 points with long text fields (address_raw, source_urls) for the point window: in a dense tile the densest
  # points are dropped instead of making the tile huge. The default of point layers (keep every point) is not used here.
  # Decision for ARCH6 (handoff PUB Rev 42); the size of the .pmtiles is reported after the dev build.
  extra_args: ["-r1", "--drop-densest-as-needed", "--extend-zooms-if-still-dropping"]
citation:
  text: "Ilin, V. ({year}). AI Buildout Frontier · {title} (version {version}) [Data set]. Zenodo. {doi_url}"
  record_pattern: "Ilin, V. AI Buildout Frontier, layer {layer_id}, record {record_key}, version {version}. {doi_url}"
