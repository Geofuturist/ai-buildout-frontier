verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
    agent_sample: 0.0816
  sample_share:
    places_geonames_address: 0.1016
    places_census_place: 0.1282
    places_geonames_name: 0.1192
    places_census_county: 0.0985
  method: >-
    Places are set by script rules in a fixed order: a town named in the record's address (GeoNames), a
    U.S. Census place named in the address, a town named in the record name (GeoNames), the U.S. county
    given by the record, or no place. No geocoding service and no approximate matching of names are
    used. An independent AI session that did not build the layer checked a fixed random sample against
    GeoNames and the Census files, without web access: 10% of each place source, and separate samples of
    places matched to a region name, places chosen by population and places matched by an alternate
    name, 870 checks in all. 845 agreed, 17 were disputed and 8 could not be decided; all 156 county
    placements agreed. The disputed places came from errors in the rules, so the rules were corrected and
    the layer rebuilt: an alternate name equal to a first-level region is not used, a town must match a
    whole part of the address, a town from the name must lie in the record's region and, if the record
    has an address, appear in it, and hyphenated words are not split. This changed the place of 269
    records. Three disputed places that the corrected rules still gave were removed (location_state =
    disputed_by_check). 82 records received another or a new town from the corrected rules and were not
    in the sample; a second AI session read all 82, and in each the town is named in the record's own
    address or name and lies in its region. 805 sampled records keep the place that was checked: 799
    agreed, 6 undecided. The verdicts are published with the dataset in ver_results_places.csv,
    ver_recheck_log_DC_v0_1_0.csv and rule_new_places_RES_read.csv.
