coverage:
  geography: "126 countries and territories listed in the Atlas national tables"
  iso3_from: iso3_source
  known_gaps:
  - >-
    Records were copied by hand from the national tables of the Atlas (its Copy as: Table function) for
    all 126 countries and territories it lists, between 14 and 18 October 2026; the Atlas data were
    last updated on 8 October 2026. The Atlas has no bulk download yet. It states that it is
    incomplete, contains errors and changes between versions, and this layer carries that over.
  - >-
    The table copies have no coordinates. A point marks the town named in the record's address or
    name, not the site, which may lie several kilometers away. No point is at site precision.
  - >-
    1,583 U.S. records (16.0%) are placed only in their county, and 2,195 records (22.3%) have no place
    below the country: outside the United States, 2,160 of 5,827 records (37.1%). These records are in
    the files and in the country counts but are not drawn on the map.
  - >-
    The place of 1,686 records (17.1%) comes from the record name, because their address gives no town
    or they have no address. We tested this rule on 4,160 Atlas records whose town is known from their
    address, applying it as it applies to records without an address: it gave a place for 2,230 of
    them, the same town in 86.9% (95% interval 85.4–88.2%), a different town less than 25 km away in
    8.3% and 25 km or more away in 4.9%; in the United States 93.2%, 5.5% and 1.3%, elsewhere 82.8%,
    10.0% and 7.2%. The test records have addresses, while 1,282 of the 1,686 records placed this way
    have none; their names may point to a region or market rather than a town more often, so the
    accuracy on them may be lower. It cannot be measured on this reference.
  - >-
    4,048 records (41.0%) have no address in the Atlas and 4,106 (41.6%) no source link; for 3,507
    records (35.5%) the Atlas gives neither, only the name, operator, country and region.
  - >-
    Records are not merged: 329 records form 148 groups identical in every field, and 1,222 records
    form 562 groups with the same name, address, operator and country. They may be separate sites,
    buildings or phases that the table does not tell apart, or repeats.
  - >-
    record_id is computed from the Atlas row. If the Atlas changes any field of a record, the record
    gets a new identifier in the next version of this layer.
  - "The Atlas status Operating / Construction covers both operating sites and sites under construction."
  - >-
    The size class is the Atlas's own. The Atlas does not state whether it refers to IT power or to the
    whole facility, so it cannot be compared with the megawatts of the Epoch AI layer. 1,257 records
    (12.7%) have the class Unknown.
  - >-
    One record that the Atlas lists under Somaliland is coded SOM, because abf-boundaries has no
    separate unit for Somaliland. This follows the boundary frame and is not a position on its status.
  - >-
    One record that the Atlas lists under Russia, the Crimean Republican Data Center, is placed in
    Simferopol, in Crimea, which abf-boundaries v0.2.0 shows under Russian control and records as
    claimed by Ukraine (contested_areas). Its iso3_source, iso3_frame and control_iso3 are RUS. This
    records the source and the control on the ground, not a position of the project.
  - >-
    For four records in border towns (Grevenmacher, Gibraltar, Sittard, Lauterbourg) the town is right,
    but on the generalized 1:10 million outlines its point falls in the neighboring country, so
    iso3_frame differs from iso3_source. Counts by country use the Atlas country.
