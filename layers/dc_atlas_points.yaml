# abf-dc v0.1.0 · layer 1 of 3. Texts: claude/RES_texts_DC_v0_1_0.md r2 (sections 1, 4, 5, 6, 7), word for word.
# Build rules: claude/SPEC_DC_world_v0_1_0.md r7 (sections 4, 13, 14). Structure by [CODE-PUB].
# The input table is the output of the data build (scripts/dc/dc_build.py, [CODE-DC]); this build does not change a value.
layer_id: dc_atlas_points
title: "Data centers · Atlas of Data Center Politics · records"
title_ru: "ЦОД · Atlas of Data Center Politics · записи"
domain: dc
level: point
input:
  table: 'D:\GISData\AI\DC\out\abf-dc-v0.1.0\dc_atlas_points.csv'
  files:
    geonames_cities500: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\cities500.zip'
    geonames_admin1: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\admin1CodesASCII.txt'
    geonames_country_info: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\countryInfo.txt'
    geonames_readme: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\Readme.txt'
    census_places_zip: 'D:\GISData\AI\DC\sources\census\2023_Gaz_place_national.zip'
    census_places_txt: 'D:\GISData\AI\DC\sources\census\2023_Gaz_place_national.txt'
    frame_adm0: 'D:\GISData\AI\DC\sources\frame\adm0.parquet'
    frame_units: 'D:\GISData\AI\DC\sources\frame\units.csv'
    frame_analysis_usa_adm2: 'D:\GISData\AI\DC\sources\frame\analysis_usa_adm2.parquet'
    frame_contested_areas: 'D:\GISData\AI\DC\sources\frame\contested_areas.parquet'
description: >-
  Data-center records of the Atlas of Data Center Politics (Infrastructure Lab, National University of
  Singapore), copied from its national tables for all 126 countries and territories it lists, with the
  name, operator, status, start year and size class as the Atlas gives them. A record states what the
  Atlas lists; the project has not checked that each site exists. The table copies carry no
  coordinates, so the project places each record itself: at the town named in its address or name, or,
  in the United States, in the county the record gives. A point marks the town, not the site. Identical
  records are not merged, because they may be different sites that the table does not tell apart.
  Capacity is the Atlas's size class as given; where the Atlas gives none, it is shown as unknown, not
  estimated.
fields:
- name: record_id
  type: string
  nullable: false
  description: >-
    Identifier set by the project: ATL- and the first 12 hexadecimal characters of the SHA-256 of all
    fields of the Atlas row. Records identical in every field get the suffix -1, -2 and so on, in the
    order of the copy. The identifier changes if the Atlas changes the row.
- name: unit_id
  type: string
  nullable: true
  description: >-
    For a record placed in a U.S. county (coord_precision = county), the county; for a record without a
    place (coord_precision = none), the country under which the Atlas lists it. Codes of abf-boundaries
    v0.2.0.
  null_meaning: "The record has a point (lon, lat)."
- name: lon
  type: number
  nullable: true
  description: "Longitude of the town the record is placed at (WGS 84): the GeoNames point of the town or the Census internal point of the U.S. place."
  null_meaning: "No point: the record is placed in a county or has no place below the country (see location_state)."
- name: lat
  type: number
  nullable: true
  description: "Latitude of the town the record is placed at (WGS 84), as for lon."
  null_meaning: "No point: the record is placed in a county or has no place below the country (see location_state)."
- name: coord_source
  type: string
  nullable: true
  allowed_values: [geonames_address, census_place, geonames_name, census_county]
  description: >-
    How the place was found: geonames_address (a town named in the record's address, found in
    GeoNames); census_place (a U.S. place named in the address, found in the Census Gazetteer 2023);
    geonames_name (a town named in the record name, found in GeoNames); census_county (the U.S. county
    given by the record).
  null_meaning: "No place below the country was found (coord_precision = none)."
- name: coord_precision
  type: string
  nullable: false
  allowed_values: [city, county, none]
  description: "city (a point at the town), county (a U.S. county, no point) or none (no place below the country)."
- name: place_name
  type: string
  nullable: true
  description: "Name of the town or U.S. place of the point, as GeoNames or the Census Gazetteer gives it."
  null_meaning: "The record has no town point."
- name: place_ref
  type: string
  nullable: true
  description: "Identifier of that place: geonames:<geonameid> or census:<GEOID>."
  null_meaning: "The record has no town point."
- name: source_grade
  type: string
  nullable: false
  allowed_values: [secondary]
  description: "secondary for all records: the Atlas compiles its records from other sources."
- name: ref
  type: string
  nullable: false
  description: >-
    Where the record comes from: the Atlas national table, the date of the copy, and the file and row of
    the copy in the archive of copies published with the dataset.
- name: checked_at
  type: datetime
  nullable: false
  description: "Date and time of the build that set the record."
- name: checked_by
  type: string
  nullable: false
  description: >-
    Script that built the record (script:dc_build). The independent check of a sample of places is
    described in verification.
- name: name
  type: string
  nullable: false
  description: "Name of the record as given by the Atlas."
- name: operator
  type: string
  nullable: false
  description: "Operator as given by the Atlas."
- name: operator_type
  type: string
  nullable: false
  description: "Type of operator as given by the Atlas, for example Colocation, Cloud, Telecom or AI Compute."
- name: status_raw
  type: string
  nullable: false
  allowed_values: ["Operating / Construction", Planned, Retired]
  description: >-
    Status as given by the Atlas: Operating / Construction, Planned or Retired. Operating / Construction
    covers both operating sites and sites under construction.
- name: start_year
  type: integer
  nullable: true
  description: "Start year as given by the Atlas."
  null_meaning: "The Atlas gives no start year."
- name: power_class
  type: string
  nullable: true
  allowed_values: [lt10, "10_99", "100_999", ge1000]
  description: >-
    Size class as given by the Atlas: lt10 (Small, below 10 MW), 10_99 (Large, 10–99 MW), 100_999
    (Hyperscale, 100–999 MW), ge1000 (Gigascale, above 999 MW). The Atlas does not state whether the
    class refers to IT power or to the power of the whole facility.
  null_meaning: "The Atlas gives the size class Unknown (power_status = not_found)."
- name: power_basis
  type: string
  nullable: false
  allowed_values: [atlas_size_class]
  description: "atlas_size_class for all records: the value is the Atlas's size class, not a number of megawatts."
- name: power_status
  type: string
  nullable: false
  allowed_values: [found, not_found]
  description: "found: the Atlas gives a size class; not_found: the Atlas gives the class Unknown."
- name: power_status_reason
  type: string
  nullable: true
  allowed_values: [no_basis_value]
  description: "no_basis_value: the Atlas gives no size class."
  null_meaning: "power_status is found."
- name: atlas_confidence
  type: string
  nullable: false
  allowed_values: [High, Medium, Low]
  description: >-
    Positional confidence given by the Atlas (High, Medium, Low). By the Atlas's own definition it
    describes the precision of the Atlas's point, which the table copies do not contain, not the
    reliability of the record. It does not apply to the place set by the project.
- name: country_source
  type: string
  nullable: false
  description: "Country or territory under which the Atlas lists the record, as written in the Atlas."
- name: adm1_raw
  type: string
  nullable: true
  description: "First-level region as written in the Atlas."
  null_meaning: "The Atlas gives no region."
- name: adm2_raw
  type: string
  nullable: true
  description: "Second-level unit as written in the Atlas, in the United States the county."
  null_meaning: "The Atlas gives no second-level unit."
- name: address_raw
  type: string
  nullable: true
  description: "Address as written in the Atlas. Some addresses are approximate in the Atlas itself."
  null_meaning: "The Atlas gives no address."
- name: source_urls
  type: string
  nullable: true
  description: "Links to the sources the Atlas gives for the record, separated by semicolons."
  null_meaning: "The Atlas table gives no source link for the record."
- name: same_key_group
  type: string
  nullable: true
  description: >-
    Group of records with the same name, address, operator and country (SK- and a hash). They may be
    separate buildings or phases of one site, or repeats.
  null_meaning: "No other record has the same name, address, operator and country."
- name: identical_group
  type: string
  nullable: true
  description: "Group of records identical in every field of the Atlas table (IG- and a hash)."
  null_meaning: "No other record is identical in every field."
- name: iso3_source
  type: string
  nullable: false
  description: >-
    Country under which the Atlas lists the record, as the ISO 3166 alpha-3 code of a unit of
    abf-boundaries. The Atlas entry Somaliland is coded SOM.
- name: iso3_frame
  type: string
  nullable: true
  description: >-
    Country of abf-boundaries v0.2.0 in which the point lies. A point that falls outside every country on
    the generalized coastline goes to the nearest country within 10 km.
  null_meaning: "The record has no point."
- name: control_iso3
  type: string
  nullable: true
  description: >-
    State in control of the area of disputed control (contested_areas layer of abf-boundaries) in which
    the point or the record's unit lies.
  null_meaning: "The record does not lie in an area of disputed control."
- name: resolved_by_population
  type: boolean
  nullable: false
  description: >-
    true when several towns of that name lie in the same region and the place was chosen because only
    one of them has a population above zero in GeoNames.
- name: location_state
  type: string
  nullable: true
  allowed_values: [no_address, unresolved, ambiguous, disputed_by_check]
  description: >-
    Why the record has no town point: no_address (the record has no address and its name names no
    town), unresolved (a town is named but not found under the rules), ambiguous (several towns fit),
    disputed_by_check (the place given by the rules was disputed by the independent check and removed).
  null_meaning: "The record has a town point."
geometry:
  lon: lon
  lat: lat
  precision: coord_precision
  precisions: [city, county, none]
  precisions_without_point: [county, none]
unit_checks:
- {precision: county, level: ADM2, iso3: USA}
- {precision: none, level: ADM0}
unit_empty_for: [city]
iso3_columns: [iso3_source, iso3_frame, control_iso3]
# Fields that hold values of the source as they are (decision of ARCH6 23.10): G7 skips them and counts the cells.
g7_source_value_fields: [name, operator, country_source, adm1_raw, adm2_raw, address_raw, source_urls]
check_field_formats: true
