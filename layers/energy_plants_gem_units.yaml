verification:
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
    agent_sample: 0.0
  sample_share: {}
  method: 'The units are copied by script from the sheet Power facilities of the GEM file with the stated SHA-256. The build
    stops if the file differs, if the number of units or the capacity by type and status differs from the sheet, if a status
    is not in the table of base statuses, if a GEM country name has no row in GEM''s own country table, or if a country
    code is neither a country of the frame nor a row of gem_iso3_to_adm0.csv. A row of that table is accepted by script
    only if all points of the code lie in one country of the frame and none lies in an area of disputed control; the six
    rows of this version were also checked against the official status of the territories. A second run gives byte-identical
    files. The project did not check GEM''s records against other sources: the values are GEM''s.'
freshness:
  source_cadence: irregular
  next_check: '2027-01-31'
coverage:
  geography: Power plants of the world (Global Energy Monitor)
  iso3_from: iso3_source
  known_gaps:
  - 'The tracker includes plants above thresholds that differ by type: coal 30 MW (all operating and mothballed units, units
    retired since 2000 and units proposed since 2010); oil and gas 50 MW, and 20 MW in the European Union and the United
    Kingdom; utility-scale solar 1 MW for operating projects, and more than 20 MW for announced, pre-construction, construction
    and shelved projects; wind 10 MW; hydropower 30 MW; bioenergy 20 MW; geothermal 1 MW; nuclear no threshold. For some
    countries, smaller wind (from 1 MW), hydropower and bioenergy (from 10 MW) plants are included where data were readily
    available. Smaller plants and distributed solar below 1 MW are not in the layer, so its totals are not national capacity.'
  - 'The tracker joins GEM trackers of different dates: utility-scale solar and wind of February 2026, hydropower and geothermal
    of March 2026, coal of July 2026, oil and gas and nuclear of August 2026, bioenergy of September 2026. A status or capacity
    may have changed since the date of its tracker.'
  - GEM gives an approximate location for 73,268 of the 164,672 units (44.5%), which GEM bases on “using nearest city or
    other information in research”. Units of one plant can have different points. For 400 plants of the GEM file, the points
    of their units are more than 1° apart; some of these may be errors in the source. The project does not correct points.
  - 'The country is given twice: by GEM''s country table (iso3_gem, iso3_source) and by the point (iso3_frame). 4,609 units
    lie outside the generalized 1:10 million country outlines but within 22.2 km of a country, and get the nearest one;
    858 units lie farther out, most of them offshore wind, and have no iso3_frame. For 291 units the point lies in another
    country of the frame than the one GEM names. Some of them lie near borders, where generalized outlines can put a point
    across the line; others lie in areas that GEM and the frame assign differently, such as Crimea (31 units, listed by
    GEM under Ukraine and shown in the frame under Russian control). Neither is a position of the project.'
  - Hydropower includes pumped storage, in which, as GEM defines it, “The project generates electricity using water which
    is cycled between a lower and an upper reservoir by a pumping system.” Offshore wind is not a type of its own. Both
    are told apart only by technology.
  - 'Solar capacity mixes AC and DC values. GEM notes: “Capacity may be reported as the DC / peak value the arrays could
    provide or as the AC value of what will be tied into the grid. This is often not specified and could be either value
    when reported as just ''MW''.” capacity_rating gives the basis where GEM knows it.'
  - 'Two units have a capacity of 0 MW in GEM: G100001094818 (China Coal Bengbu power station, pre-construction) and G100001023514
    (Guodian Chaohu Distributed Gas power station, cancelled - inferred 4 y). The value is published as given, in class
    lt10.'
  - The statuses shelved - inferred 2 y (2,809 units) and cancelled - inferred 4 y (2,989 units) are GEM's own inference
    from “lack of observed progress” for two or four years, not a report by the owner. They are counted under shelved and
    cancelled.
  - GEM marks 18,732 utility-scale solar units (84,304 MW) as partially or fully sourced from TransitionZero's Solar Asset
    Mapper, which is under CC BY-NC 4.0. They are not in this dataset, which is under CC BY 4.0, but in abf-energync. 15
    plants have units in both datasets.
  - In the United States, this layer and the project's layers from Form EIA-860 of the U.S. Energy Information Administration
    are separate sources and are not reconciled. Their figures for the same state can differ.
  - 'The two data-center flags are GEM''s, published as GEM gives them; the project does not check them. captive_dc: 399
    units (227,213 MW of all statuses; 29 operating units, 6,496 MW) that GEM lists as captive plants of a data center,
    which GEM describes as plants “within industrial facilities” that “typically supply most of their power” to the facility.
    dc_ppa: 32 nuclear and geothermal units (11,404 MW) that GEM lists as “connected to a data center through a PPA”. GEM
    keeps the PPA field for nuclear and geothermal only, so a power purchase agreement with a plant of another type is not
    flagged. A unit without a flag may still supply a data center.'
