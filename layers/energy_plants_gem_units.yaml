# abf-energy / abf-energync 0.1.0. Texts: claude/RES_texts_GEM_v0_1_0.md r1 (sections 1-7), word for word.
# Build rules: claude/SPEC_GEM_plants_v0_1_0.md r7 (sections 3, 3a, 3b). Generated by the one-off script gen_gem_yaml.py; edit the yaml by hand afterwards.
layer_id: energy_plants_gem_units
title: Power plants · Global Energy Monitor · generating units
title_ru: Электростанции · Global Energy Monitor · энергоблоки
domain: energy
level: point
uses_boundary_frame: true
input_columns_exact: true
csv_identical_to_input: true
input:
  table: data\gem\energy_plants_gem_units.csv
  files:
    gem_xlsx: D:\GISData\Energy\GEM\Global Integrated Power September 2026 V2.xlsx
description: 'Power generating units and phases of the world from the Global Integrated Power Tracker of Global Energy Monitor
  (GEM), September 2026 release: one row for each of the 164,672 units of the tracker that GEM does not mark as sourced
  from TransitionZero''s Solar Asset Mapper. The tracker compiles GEM''s eight trackers of coal, oil and gas, utility-scale
  solar, wind, hydropower, nuclear, bioenergy and geothermal power, each with its own capacity threshold. Units of all GEM
  statuses are included, from announced to retired, so capacity should be added up only within one status. GEM''s fields
  are copied unchanged. The project adds the GEM base status, a size class, country codes in its boundary frame and a code
  for GEM''s two data-center flags. The 18,732 units that GEM marks as sourced from TransitionZero are published separately,
  in abf-energync under CC BY-NC 4.0. This layer is published as files; the map shows energy_plants_gem_locations.'
fields:
- name: record_id
  type: string
  nullable: false
  description: 'GEM unit/phase ID: GEM''s key of the unit or phase (G followed by 11 digits).'
- name: location_id
  type: string
  nullable: false
  description: 'GEM location ID: GEM''s key of the plant. All units of a plant share it.'
- name: plant_name
  type: string
  nullable: false
  description: Name of the plant or project, as GEM gives it.
- name: unit_name
  type: string
  nullable: true
  description: Name or number of the unit or phase, as GEM gives it.
  null_meaning: GEM gives no unit or phase name.
- name: type
  type: string
  nullable: false
  allowed_values:
  - coal
  - oil/gas
  - utility-scale solar
  - wind
  - hydropower
  - nuclear
  - bioenergy
  - geothermal
  description: 'One of GEM''s eight power technology groups: coal, oil/gas, utility-scale solar, wind, hydropower, nuclear,
    bioenergy, geothermal.'
- name: technology
  type: string
  nullable: true
  description: Technology as GEM gives it, for example run-of-river, pumped storage or offshore hard mount. Offshore wind
    and pumped-storage hydropower are told apart only in this field.
  null_meaning: GEM gives no technology. All bioenergy units are without one.
- name: fuel
  type: string
  nullable: true
  description: Fuel of a combustion unit, as GEM gives it.
  null_meaning: Not a combustion unit, or GEM gives no fuel.
- name: capacity_mw
  type: number
  nullable: false
  description: Capacity in megawatts as GEM gives it. GEM defines it as “Total nameplate capacity, or best available data,
    of the project, in megawatts”. For solar units, see capacity_rating.
- name: capacity_rating
  type: string
  nullable: true
  description: 'Solar units only: whether GEM gives the capacity as an AC value (MWac), as a DC or peak value (MWp/dc),
    or unknown.'
  null_meaning: Not a solar unit.
- name: capacity_class
  type: string
  nullable: false
  allowed_values:
  - lt10
  - '10_99'
  - '100_999'
  - ge1000
  description: 'Size class of capacity_mw: lt10 (under 10 MW), 10_99 (10 to under 100 MW), 100_999 (100 to under 1,000 MW),
    ge1000 (1,000 MW and more). A capacity of 0 is in lt10.'
- name: status
  type: string
  nullable: false
  description: 'Status as GEM gives it: one of GEM''s eight base statuses or one of two statuses that GEM infers, shelved
    - inferred 2 y and cancelled - inferred 4 y.'
- name: status_group
  type: string
  nullable: false
  allowed_values:
  - announced
  - pre_construction
  - construction
  - operating
  - shelved
  - cancelled
  - mothballed
  - retired
  description: 'GEM base status: announced, pre_construction, construction, operating, shelved, cancelled, mothballed or
    retired. The two inferred statuses are counted under shelved and cancelled.'
- name: start_year
  type: integer
  nullable: true
  description: Start year, as GEM gives it.
  null_meaning: GEM gives no start year.
- name: retired_year
  type: integer
  nullable: true
  description: Year of retirement, as GEM gives it.
  null_meaning: Not retired, or GEM gives no year.
- name: owners
  type: string
  nullable: true
  description: Owners as GEM gives them, with their shares in brackets.
  null_meaning: GEM names no owner.
- name: operators
  type: string
  nullable: true
  description: Operators as GEM gives them.
  null_meaning: GEM names no operator.
- name: country_area
  type: string
  nullable: false
  description: Country or area as GEM names it. GEM notes that this column “presents energy data within various economic
    contexts, and the geographical unit does not strictly follow political boundaries”.
- name: subnational_unit
  type: string
  nullable: true
  description: State or province, as GEM gives it.
  null_meaning: GEM names no state or province.
- name: iso3_gem
  type: string
  nullable: false
  description: ISO 3166-1 alpha-3 code of country_area, from the country table in GEM's own file (sheet Regions, area, and
    countries).
- name: iso3_source
  type: string
  nullable: false
  description: 'Country of the record in the project''s boundary frame (ADM0 of abf-boundaries v0.2.0). It equals iso3_gem
    except for six territories that GEM lists separately and the frame includes in a country: Réunion, Guadeloupe, Martinique,
    French Guiana and Mayotte are FRA; Bonaire, Sint Eustatius and Saba are NLD (gem_iso3_to_adm0.csv).'
- name: iso3_frame
  type: string
  nullable: true
  description: Country of the frame in which the point lies. For a point outside all countries, the nearest country if it
    is within 22.2 km (12 nautical miles, the breadth of the territorial sea).
  null_meaning: The point lies more than 22.2 km from the land of any country of the frame. Most such units are offshore
    wind farms.
- name: iso3_frame_rule
  type: string
  nullable: true
  allowed_values:
  - within
  - nearest_12nmi
  description: 'How iso3_frame was found: within (the point lies inside the country) or nearest_12nmi (the point lies outside
    all countries, and this is the nearest one within 22.2 km).'
  null_meaning: No country of the frame within 22.2 km (iso3_frame is empty).
- name: control_iso3
  type: string
  nullable: true
  description: 'State in control, for a point inside an area of disputed control of abf-boundaries v0.2.0 (contested_areas).
    In this version: Crimea, under Russian control (RUS), claimed by Ukraine.'
  null_meaning: The point does not lie in an area of disputed control.
- name: location_accuracy
  type: string
  nullable: false
  allowed_values:
  - exact
  - approximate
  description: 'exact or approximate, as GEM gives it. GEM: “Approximate based on using nearest city or other information
    in research, or exact based on visibility on map or given in research”.'
- name: coord_precision
  type: string
  nullable: false
  allowed_values:
  - site
  - approximate
  description: site where GEM gives the location as exact; approximate where GEM gives it as approximate.
- name: coord_source
  type: string
  nullable: false
  allowed_values:
  - gem
  description: 'gem: the point is GEM''s.'
- name: lon
  type: number
  nullable: false
  description: Longitude in decimal degrees, as GEM gives it. The project does not move or round points.
- name: lat
  type: number
  nullable: false
  description: Latitude in decimal degrees, as GEM gives it. The project does not move or round points.
- name: captive_industry_type
  type: string
  nullable: true
  description: Industry that a captive plant serves, as GEM gives it, for example data center, aluminum or chemicals.
  null_meaning: GEM does not list the unit as a captive plant.
- name: data_center_ppa
  type: string
  nullable: true
  description: yes where GEM lists the unit as connected to a data center through a power purchase agreement. GEM keeps
    this field for nuclear and geothermal units only.
  null_meaning: GEM gives no value; GEM keeps this field for nuclear and geothermal units only.
- name: dc_link
  type: string
  nullable: true
  description: 'The project''s code for GEM''s two data-center flags: captive_dc where captive_industry_type contains “data
    center”; dc_ppa where data_center_ppa is yes. The flags are GEM''s; the project does not check them.'
  null_meaning: The unit carries neither data-center flag of GEM.
- name: river
  type: string
  nullable: true
  description: 'Hydropower units only: river or watercourse, as GEM gives it.'
  null_meaning: Not a hydropower unit, or GEM names no watercourse.
- name: other_ids_location
  type: string
  nullable: true
  description: Identifiers of the plant in other datasets, as GEM lists them (for example OpenStreetMap).
  null_meaning: GEM lists no other identifier of the plant.
- name: other_ids_unit
  type: string
  nullable: true
  description: Identifiers of the unit in other datasets, as GEM lists them (for example OpenStreetMap, or TZ for the TransitionZero
    Solar Asset Mapper).
  null_meaning: GEM lists no other identifier of the unit.
- name: wiki_url
  type: string
  nullable: false
  description: Page of the plant on GEM.wiki, with GEM's references.
geometry:
  lon: lon
  lat: lat
  precision: coord_precision
  precisions:
  - site
  - approximate
  precisions_without_point: []
iso3_columns:
- iso3_source
- iso3_frame
- control_iso3
g7_source_value_fields:
- unit_name
- owners
- subnational_unit
expected_counts:
  rows: 164672
  value_counts:
    coord_precision:
      approximate: 73268
      site: 91404
    iso3_frame_rule:
      nearest_12nmi: 4609
      within: 159205
      (empty): 858
  value_counts_listed:
    status:
      shelved - inferred 2 y: 2809
      cancelled - inferred 4 y: 2989
    dc_link:
      captive_dc: 399
      dc_ppa: 32
  nonempty_counts:
    control_iso3: 31
    dc_link: 431
  zero_counts:
    capacity_mw: 2
