verification:
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  method: Rows for electricity and the data year are summed by department and sector by script from the
    source table. Department totals were compared with the sum of the municipal file of the same source.
    No value was re-checked by a person or by an agent. The automated checks listed below were run on
    every build.
  sample_share: {}
freshness:
  source_cadence: annual
  next_check: 2027-01-31
coverage:
  geography: All 101 departments
  known_gaps:
  - In 31 departments the source publishes 85 department × sector rows without a value; their consumption
    is not in the totals, so the totals of these departments are lower bounds (see n_rows_without_value).
  - 'Department totals are not reduced by the statistical confidentiality applied to municipalities: the
    department file exceeds the sum of the municipal file by 0.12% nationally; in four departments (59,
    45, 80, 95) it is lower by at most 0.02%, which is treated as a difference between the two extracts.'
display:
  geometry_type: polygon
  value_field: consumption_mwh
  unit: MWh
  breaks:
  - 1400000
  - 2400000
  - 3900000
  - 6000000
  zero_class: false
  legend_title: Electricity consumption 2024, MWh
citation:
  text: AI Buildout Frontier. {title}. Version {version}, {year}. {doi_url}
  record_pattern: AI Buildout Frontier, layer {layer_id}, unit {record_key}, version {version}. {doi_url}
tiles:
  minzoom: 0
  maxzoom: 10
checks:
  totals_vs_source:
    kind: csv
    source_file: D:\GISData\Energy\France\agenceore_consommation\6l33py6xpnaolvzkckzkhcic.csv
    separator: auto
    decimal: ','
    code_column: Code Département
    code_zfill: 2
    unit_prefix: FRA-2-
    filters:
    - column: FILIERE
      contains: lec
    - column: Année
      equals: '2024'
    outside: []
    columns:
    - layer_column: consumption_mwh
      value_column: Conso totale (MWh)
      filters: []
    - layer_column: consumption_mwh_residential
      value_column: Conso totale (MWh)
      filters:
      - column: CODE GRAND SECTEUR
        in:
        - RESIDENTIEL
    - layer_column: consumption_mwh_tertiary
      value_column: Conso totale (MWh)
      filters:
      - column: CODE GRAND SECTEUR
        in:
        - TERTIAIRE
    - layer_column: consumption_mwh_industry
      value_column: Conso totale (MWh)
      filters:
      - column: CODE GRAND SECTEUR
        in:
        - INDUSTRIE
    - layer_column: consumption_mwh_agriculture
      value_column: Conso totale (MWh)
      filters:
      - column: CODE GRAND SECTEUR
        in:
        - AGRICULTURE
    - layer_column: consumption_mwh_unknown
      value_column: Conso totale (MWh)
      filters:
      - column: CODE GRAND SECTEUR
        not_in:
        - RESIDENTIEL
        - TERTIAIRE
        - INDUSTRIE
        - AGRICULTURE
    - layer_column: n_delivery_points
      value_column: Nb sites
      filters: []
