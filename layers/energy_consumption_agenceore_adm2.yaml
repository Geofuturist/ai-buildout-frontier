layer_id: energy_consumption_agenceore_adm2
title: Electricity consumption · Agence ORE · department
title_ru: Потребление электроэнергии · Agence ORE · департаменты
domain: energy
level: ADM2
frame:
  iso3: FRA
  level: ADM2
  code_regex: \d{2,3}|2[AB]
  service_fields:
  - unit_id
  - name
  - coverage_status
input:
  table: data\fra\layer_consumption_agenceore_20261010.csv
  key: unit_id
  legacy_meta: data\fra\layer_consumption_agenceore_20261010_meta.json
  coverage_column: coverage_status
  coverage_note_column: coverage_note
description: 'Electricity delivered to consumers in 2024 in each department, in MWh, as reported by the
  grid operators and published by Agence ORE, with the split by sector and the number of delivery points.
  The total includes consumers on the transmission network and on distribution networks. This is annual
  metered energy, not peak power: it is not comparable with the modeled peak demand of the U.S. demand
  layer.'
fields:
- name: consumption_mwh
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Electricity delivered in the department in the year, in MWh.
- name: consumption_mwh_residential
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to households.
- name: consumption_mwh_tertiary
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to services and public administration.
- name: consumption_mwh_industry
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to industry.
- name: consumption_mwh_agriculture
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to agriculture.
- name: consumption_mwh_unknown
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh whose sector is not known to the grid operator.
- name: n_delivery_points
  type: integer
  nullable: false
  min: 0
  description: Number of delivery points (sites) as counted in the source.
- name: n_rows_without_value
  type: integer
  nullable: false
  min: 0
  description: Number of department × sector rows that the source publishes without a consumption value.
    When above 0, consumption_mwh and the sector columns of this department are lower bounds.
- name: data_year
  type: integer
  description: Year of the consumption data.
  nullable: false
