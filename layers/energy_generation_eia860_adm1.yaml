coverage:
  geography: "United States: the 50 states and the District of Columbia"
  known_gaps:
  - Generators that entered service after the end of the edition year are not included.
  - A generator counts in the state named in its record, while the county layer places it by the coordinates of its plant.
    For 22 plants (107 generators, 5,272.8 MW) the two disagree, so the state values of both states involved differ from
    the sums of their counties. The largest are John Day, The Dalles and McNary, recorded in Oregon with coordinates in
    Washington counties; Hoover Dam (AZ), recorded in Arizona with coordinates in a Nevada county; and Keokuk, recorded
    in Iowa with coordinates in an Illinois county. We did not check which of the two is right for any of them. state_reconciliation.csv
    lists all 22.
  - 'Three offshore wind plants (171.3 MW: Block Island Wind Farm, South Fork Wind and the Coastal Virginia Offshore Wind
    pilot) are in the values of Rhode Island, New York and Virginia, but in no county value.'
  - Form EIA-860 covers power plants with a combined nameplate capacity of 1 MW or more. Emergency and standby generators
    at data centers and other buildings are generally not reported to it.
  - One operating generator has no generator ID in the source (Cranberry Point Energy Storage, plant 62844, Massachusetts,
    150 MW). Its capacity is in the Massachusetts value, but it is not counted in n_op_generators.
  - 69 operating generators have no numeric summer capacity in the source and add nothing to net_summer_capacity_mw.
