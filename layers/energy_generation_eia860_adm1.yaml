extra_files:
- path: data\conus\state_reconciliation_20261108.csv
  publish_as: state_reconciliation.csv
  description: 'Why a state value differs from the sum of its counties. One row per layer, state and summed field (759 rows):
    the state value, the sum of the published county values, the difference, and the records behind it by category — offshore
    plants without a county; plants or requests whose record names this state but whose coordinates or county code lie in
    another state, and the reverse; Connecticut requests; requests without a county code — and the residual, which is 0
    (for transmission lines, within the rounding tolerance). For demand, where a state peak is not a sum, the row gives
    the peak hour in UTC, the largest county peak and the ratio of the state peak to the sum of the county peaks. The column
    detail names the plants and requests.'
