description: Net summer capacity of the operating generators listed in Form EIA-860, summed by state, with the number of
  those generators and of their plants. A generator counts in the state named in its record, not where the coordinates of
  its plant fall, so a state value can differ from the sum of its counties; state_reconciliation.csv lists every difference.
