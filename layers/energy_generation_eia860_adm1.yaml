  type: number
  unit: MW
  nullable: false
  description: Sum of the net summer capacity of the operating generators (status OP) whose record names the state. 0 means
    EIA-860 lists no operating generator in this state.
  fill_na_covered: 0
  min: 0
- name: n_op_generators
  type: integer
  nullable: false
  description: Number of operating generators (status OP) whose record names the state. 0 means none are listed. A generator
    without an ID in the source is not counted (see known gaps).
  fill_na_covered: 0
  min: 0
- name: n_op_plants
  type: integer
  nullable: false
  description: Number of plants with at least one operating generator whose record names the state. 0 means none are listed.
  fill_na_covered: 0
  min: 0
