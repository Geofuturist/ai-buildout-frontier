    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  method: 'Values are computed by script from the source tables: operating generators are summed by the state named in their
    record. The same run recomputed the county layer from the same files and matched the published county values of version
    0.1.0 in every county. Every difference between a state and the sum of its counties is explained in state_reconciliation.csv
    by a listed category, with no residual. No value was re-checked by a person or by an agent. The automated checks listed
    below were run on every build.'
