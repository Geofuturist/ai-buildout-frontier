# Layer config: transmission lines, HIFLD, aggregated by county.
layer_id: energy_transmission_hifld_adm2
title: "Transmission lines · HIFLD · county"
title_ru: "ЛЭП · HIFLD · округа"
domain: energy
level: ADM2
frame: {iso3: USA, level: ADM2}
input:
  table: 'data\conus\layer_transmission_lines_hifld_20260913.csv'
  key: fips
  legacy_meta: 'data\conus\layer_transmission_lines_hifld_meta.json'
  derive:
    - {op: sum, name: km_total, columns: [km_ge765, km_v500, km_v345, km_v230, km_v138, km_v115, km_v69, km_lt69_unknown]}
description: >-
  Kilometres of transmission line inside each county by voltage class, their sum, the highest
  voltage class present, and whether the county has any line. Lengths are measured inside the
  county; a line that crosses a boundary is counted only for the part inside. Alaska and Hawaii are
  not processed and have empty values.
fields:
  - name: max_voltage_kv
    type: number
    unit: kV
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: "The county has no line, or none of its lines has a recorded voltage."
    description: "Highest voltage among the lines inside the county that have a recorded voltage."
  - name: has_any_line
    type: boolean
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: null
    description: "True if at least one line of the source file touches the county. It can be true while km_total is 0 when the length inside the county is below the rounding of the kilometre columns."
  - name: frac_km_unknown_voltage
    type: number
    unit: share
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: "The county has no line length inside it, so the share is undefined."
    description: "Share of the line length inside the county that has no recorded voltage, from 0 to 1."
  - {name: km_ge765, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 735 kV and above, rounded to whole kilometres. 0 means no such line."}
  - {name: km_v500, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 500 kV, rounded to whole kilometres. 0 means no such line."}
  - {name: km_v345, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 345 kV, rounded to whole kilometres. 0 means no such line."}
  - {name: km_v230, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 230 kV, rounded to whole kilometres. 0 means no such line."}
  - {name: km_v138, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 138 kV, rounded to whole kilometres. 0 means no such line."}
  - {name: km_v115, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 115 kV, rounded to whole kilometres. 0 means no such line."}
  - {name: km_v69, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county, class 69 kV, rounded to whole kilometres. 0 means no such line."}
  - {name: km_lt69_unknown, type: integer, unit: km, nullable: true, null_meaning: {not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed.", covered: null}, description: "Line length inside the county with a class below 69 kV or without a recorded voltage, rounded to whole kilometres. 0 means no such line."}
  - name: km_total
    type: integer
    unit: km
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: null
    description: "Sum of the published km columns (km_ge765 to km_lt69_unknown). The columns are whole kilometres, so km_total is exactly their sum and differs from the true line length by at most 4 km."
