coverage:
  geography: Contiguous United States and the District of Columbia
  known_gaps:
  - Alaska and Hawaii are not covered.
  - The state values include 35 active requests that have a state but no county code (11,280.7 MW) and the seven active
    Connecticut requests (678.2 MW). The county layer has neither, so a state value can exceed the sum of its counties.
  - 'Five requests name one state and carry the county code of another: Q362 (North Carolina; county code in Arizona, 275.0
    MW), BHBE G20 (South Dakota; Nebraska, 250.0 MW), 956747 (South Carolina; North Carolina, 455.0 MW), J3785 (Michigan;
    Wisconsin, 200.0 MW) and GEN-2020-065 (New Mexico; Texas, 1,003.0 MW). Each counts in the state of its state field and
    in the county of its code. We did not check which is right.'
  - '53 active requests (8,813.0 MW) are not in the layer: 49 give no state and 4 give the code MX.'
  - Eleven active requests with capacity of zero or less (-193.5 MW in total) are excluded, as in the county layer. The
    reason for the negative values is not checked against the source codebook.
  - When a request has more than one capacity value in the file (columns mw1 to mw3), the largest is used, not the sum.
  - The queue changes continuously; the file is a snapshot of requests as reported by grid operators and utilities.
verification:
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  method: 'Active requests are summed by script by the state named in each request; for each request the largest of its
    capacity values is taken. The same run recomputed the county layer and matched the published county values of version
    0.1.0 in every county. All 8,513 active requests of the source file fall into disjoint categories: 8,449 in the layer,
    53 outside it, 11 with capacity of zero or less. Every difference between a state and the sum of its counties is explained
    in state_reconciliation.csv, with no residual. No value was re-checked by a person or by an agent. The automated checks
    listed below were run on every build.'
  sample_share: {}
