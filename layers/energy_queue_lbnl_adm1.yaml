description: Capacity of the active interconnection requests in the Queued Up data file (2026 edition), summed by the state
  named in each request, with the number of those requests. These are generation and storage projects asking to connect
  to the grid, not electricity users. A state with no active request in the file has the value 0. Unlike the county layer,
  Connecticut is covered, and requests without a county code are counted. Alaska and Hawaii are not covered and have empty
  values.
