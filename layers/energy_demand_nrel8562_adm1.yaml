description: Highest hourly electricity demand of each state in 2023, in MW, from the modeled county demand profiles of
  OEDI submission 8562 (National Laboratory of the Rockies, formerly NREL). The profiles of the state's counties are added
  up hour by hour, and the highest of the 8,760 hourly totals is taken. This is not the sum of the county peaks, because
  counties reach their peaks at different hours. Alaska and Hawaii are not covered, because the source covers
  only the contiguous United States, and have empty values.
fields:
- name: peak_demand_mw
  type: number
  unit: MW
  nullable: true
  null_meaning:
    not_covered: The state is Alaska or Hawaii; the source covers only the contiguous United States.
    covered: null
  description: 'Highest hourly demand of the state in 2023: the maximum over the year of the hourly sum of its counties''
    profiles. The profiles are modeled, not metered.'
