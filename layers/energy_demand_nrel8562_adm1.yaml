coverage:
  geography: Contiguous United States and the District of Columbia
  known_gaps:
  - "Alaska and Hawaii are not covered: the source covers only the contiguous United States."
  - 'County demand is modeled, not metered: in this dataset, retail sales reported by utilities are totaled by state and
    allocated to counties by each county''s share of the state population. The state is therefore closer than the county
    to the level at which the source starts.'
  - The 49 state peaks add up to 810,503.2 MW, less than the 822,740.1 MW of the county peaks. For each state the peak is
    between 94.4% (California) and 100% of the sum of its county peaks.
  - The hour of each state's peak is not a field of the layer; state_reconciliation.csv gives it in UTC.
verification:
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  method: The hourly profiles of each state's counties are added up by script and the yearly maximum is taken. The same
    run recomputed the county peaks and matched the published values of version 0.1.0 in every county. For every state the
    build checked that its peak is not below its largest county peak and not above the sum of its county peaks. No value
    was re-checked by a person or by an agent. The automated checks listed below were run on every build.
  sample_share: {}
