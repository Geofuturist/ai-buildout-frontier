# Layer config: generation, EIA-860, county level (SPEC_META_publish_v0_1 section 5).
# Public texts are a draft by [CODE-PUB]; [RES] edits title, description, known_gaps,
# null_meaning and attribution_text before the final release.
layer_id: energy_generation_eia860_adm2
title: "Generation · EIA-860 · county"
title_ru: "Генерация · EIA-860 · округа"
domain: energy
level: ADM2
frame: {iso3: USA, level: ADM2}
input:
  # Built by [CODE-PILOT] on 2026-10-09 (EIA-860 2025 final).
  table: 'data\conus\layer_generation_eia860_20261009.csv'
  key: fips
  rename: {net_summer_gen_mw: net_summer_capacity_mw}   # capacity, not generation (P1)
  legacy_meta: 'data\conus\layer_generation_eia860_20261009_meta.json'
description: >-
  Net summer capacity of the operating generators listed in Form EIA-860, summed by county, with
  the number of those generators and of their plants. A county where EIA-860 lists no operating
  generator has the value 0. Alaska and Hawaii are not processed and have empty values.
fields:
  - name: net_summer_capacity_mw
    type: number
    unit: MW
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: null
    description: "Sum of the net summer capacity of the operating generators (status OP) located in the county. 0 means EIA-860 lists no operating generator in this county."
    fill_na_covered: 0
    min: 0
  - name: n_op_generators
    type: integer
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: null
    description: "Number of operating generators (status OP) in the county. 0 means none are listed."
    fill_na_covered: 0
    min: 0
  - name: n_op_plants
    type: integer
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: null
    description: "Number of plants with at least one operating generator in the county. 0 means none are listed."
    fill_na_covered: 0
    min: 0
