freshness: {source_cadence: annual, next_check: "2027-06-30"}
coverage:
  geography: "Contiguous United States and the District of Columbia"
  known_gaps:
    - "Alaska and Hawaii are not covered."
    - "Plants that started operating after the edition year are missing."
    - "Offshore wind farms are not assigned to any county, so they are not in the county values."
    - "Emergency generators at data centers and other buildings are not listed in EIA-860."
verification:
  levels: {source_as_is: 0.0, script_rules: 1.0, human: 0.0}
  method: >-
    Values are computed by script from the source tables: operating generators are located by the
    coordinates of their plants and summed by county. No value was re-checked by a person or by an
    agent. The automated checks listed below were run on every build.
  sample_share: {}
checks:
  totals_vs_source:
    source_file: 'D:\GISData\Energy\USA\eia8602025\3_1_Generator_Y2025.xlsx'
    sheet: Operable
    header_row: 1
    status_column: Status
    status_value: OP
    state_column: State
    mw_column: Summer Capacity (MW)
    layer_column: net_summer_capacity_mw
    states: &conus_states [AL, AR, AZ, CA, CO, CT, DC, DE, FL, GA, ID, IL, IN, IA, KS, KY, LA, MA, MD, ME, MI, MN, MO, MS, MT, NC, ND, NE, NH, NJ, NM, NV, NY, OH, OK, OR, PA, RI, SC, SD, TN, TX, UT, VA, VT, WA, WI, WV, WY]
    # Three offshore stations lie outside every county (reported by [CODE-PILOT] 09.10).
    exceptions:
      - {name: "offshore: Block Island Wind Farm, South Fork Wind, CVOW Pilot", mw: 171.3}
display:
  geometry_type: polygon
  value_field: net_summer_capacity_mw
  unit: MW
  breaks: [20, 100, 300, 900]
  zero_class: true
  legend_title: "Net summer capacity, MW"
  tile_fields: [unit_id, name, coverage_status, net_summer_capacity_mw, n_op_generators, n_op_plants]
tiles: {minzoom: 0, maxzoom: 10}
citation:
  text: "AI Buildout Frontier. {title}. Version {version}, {year}. {doi_url}"
  record_pattern: "AI Buildout Frontier, layer {layer_id}, unit {record_key}, version {version}. {doi_url}"
