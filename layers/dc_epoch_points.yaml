extra_files:
- path: 'D:\GISData\AI\DC\out\abf-dc-v0.1.0\checks.csv'
  publish_as: checks.csv
  unique_column: record_id
  covers: {column: record_id, layer_column: record_id}
  description: >-
    One row per Epoch AI site: whether the Atlas of Data Center Politics lists the same site (channel
    atlas_dcp). status is found (ref gives the Atlas record_id, several separated by semicolons),
    not_found or not_checked. checked_by is script:dc_checks where an Atlas record has the same street
    address (in the United States the same house number, street and state) or no candidate was found,
    and human:V where V judged the candidates the script listed. Where V's verdict differs from the
    address rule, the address rule decides and note keeps V's verdict. search_method gives the rule.
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
    agent_sample: 0.1596
  sample_share:
    places_geonames_address: 0.125
    places_census_place: 1.0
    places_geonames_name: 1.0
    cells_found_script: 0.2333
    cells_found_human: 0.1212
    cells_not_found_human: 1.0
  method: >-
    Places are set by the same rules as in the Atlas layer, without the county step, since the Epoch AI
    file gives no county, and without the town from the name for U.S. sites. Values, including power,
    are taken from the Epoch AI file as given. The independent AI session checked 17 places of Epoch AI
    sites in its samples; one, Johor Bahru for a site in Sedenak, was disputed and removed by the
    corrected rules, and 15 sites keep the place that was checked, all agreed. Whether the Atlas lists
    the same site (checks.csv) is decided by the address rule or, for candidates the script lists, by V.
    The independent session checked 13 of these cells against public web pages: 9 confirmed, 2 disputed,
    2 could not be decided. In both disputed cells an Atlas record has the same street address as the
    Epoch AI site, so the address rule now decides them and V's verdict is kept in the note. The verdicts
    are published with the dataset in ver_results_places.csv (with the Atlas layer) and ver_results_cells.csv.
freshness:
  source_cadence: irregular
  next_check: "2027-01-31"
coverage:
  geography: "94 AI data-center sites in 12 countries"
  iso3_from: iso3_source
  known_gaps:
  - >-
    Epoch AI selects data centers mostly by computing capacity, with a lower bar outside the United
    States, and mostly sites that become operational in 2024 or later. Its database mostly consists of
    data centers in the United States: 77 of the 94 sites are there. Epoch AI estimates that it covers
    44% of the world's deployed AI computing capacity as of 14 October 2026 (90% interval 23–81%). The
    layer is not a census of data centers.
  - >-
    Power is current IT power, an estimate of Epoch AI, not a value reported by the operator. Epoch AI
    notes that total facility power is 20–50% higher because of cooling and other overhead. 20 sites
    have 0 MW: Epoch AI counts no IT power in operation there on the file date.
  - >-
    23 sites (17 of them in the United States) have no point: the file gives no address, or the
    address names no town in a form the rules read, and for U.S. sites the town is not taken from the
    name. A point marks the town, not the site.
  - >-
    In checks.csv, found means that the Atlas lists the same site: an Atlas record has the same street
    address (in the United States the same house number, street and state), or V judged a candidate
    listed by the script to be the same site. not_checked means that the script found no candidate. An
    Atlas record without an address cannot be matched by address, so not_checked does not mean that the
    Atlas lacks the site.
