layer_id: dc_epoch_points
title: "AI data centers · Epoch AI · sites"
title_ru: "ИИ-ЦОД · Epoch AI · площадки"
domain: dc
level: point
input:
  table: 'D:\GISData\AI\DC\out\abf-dc-v0.1.0\dc_epoch_points.csv'
  files:
    geonames_cities500: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\cities500.zip'
    geonames_admin1: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\admin1CodesASCII.txt'
    geonames_country_info: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\countryInfo.txt'
    geonames_readme: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\Readme.txt'
    census_places_zip: 'D:\GISData\AI\DC\sources\census\2023_Gaz_place_national.zip'
    census_places_txt: 'D:\GISData\AI\DC\sources\census\2023_Gaz_place_national.txt'
    frame_adm0: 'D:\GISData\AI\DC\sources\frame\adm0.parquet'
    frame_units: 'D:\GISData\AI\DC\sources\frame\units.csv'
    frame_contested_areas: 'D:\GISData\AI\DC\sources\frame\contested_areas.parquet'
description: >-
  The 94 AI data-center sites of the Epoch AI data set "AI data centers" (file of 12 October 2026), with
  owner, users, current IT power, compute in H100 equivalents, capital cost and chip types as Epoch AI
  gives them. Epoch AI selects the largest AI data centers by computing capacity; the data set is not a
  census of data centers. Power is Epoch AI's estimate of current IT power in MW, a value of the
  source, not of the project; 0 MW means that Epoch AI counts no IT power in operation at the site on
  the file date. Each site is placed at the town named in its address or name; a point marks the town,
  not the site. The file checks.csv records, site by site, whether the Atlas of Data Center Politics
  lists the same site.
fields:
- name: record_id
  type: string
  nullable: false
  description: "Identifier set by the project: EPO- and the site name in lower case with hyphens."
- name: unit_id
  type: string
  nullable: true
  description: "For a site without a point (coord_precision = none), the country given by Epoch AI. Codes of abf-boundaries v0.2.0."
  null_meaning: "The site has a point (lon, lat)."
- name: lon
  type: number
  nullable: true
  description: "Longitude of the town the site is placed at (WGS 84): the GeoNames point of the town or the Census internal point of the U.S. place."
  null_meaning: "The site has no place below the country (see location_state)."
- name: lat
  type: number
  nullable: true
  description: "Latitude of the town the site is placed at (WGS 84), as for lon."
  null_meaning: "The site has no place below the country (see location_state)."
- name: coord_source
  type: string
  nullable: true
  allowed_values: [geonames_address, census_place, geonames_name]
  description: >-
    How the place was found: geonames_address (a town named in the address, found in GeoNames);
    census_place (a U.S. place named in the address, found in the Census Gazetteer 2023);
    geonames_name (a town named in the site name, found in GeoNames; not used for U.S. sites).
  null_meaning: "The site has no place below the country (see location_state)."
- name: coord_precision
  type: string
  nullable: false
  allowed_values: [city, none]
  description: "city (a point at the town) or none (no place below the country)."
- name: place_name
  type: string
  nullable: true
  description: "Name of the town or U.S. place of the point, as GeoNames or the Census Gazetteer gives it."
  null_meaning: "The site has no place below the country (see location_state)."
- name: place_ref
  type: string
  nullable: true
  description: "Identifier of that place: geonames:<geonameid> or census:<GEOID>."
  null_meaning: "The site has no place below the country (see location_state)."
- name: source_grade
  type: string
  nullable: false
  allowed_values: [secondary]
  description: "secondary for all sites: Epoch AI compiles its sites from other sources."
- name: ref
  type: string
  nullable: false
  description: "Epoch AI, AI data centers, the site name and the date of the file."
- name: checked_at
  type: datetime
  nullable: false
  description: "Date and time of the build that set the record."
- name: checked_by
  type: string
  nullable: false
  description: "Script that built the record (script:dc_build)."
- name: name
  type: string
  nullable: false
  description: "Name of the site as given by Epoch AI."
- name: owner
  type: string
  nullable: true
  description: "Owner as given by Epoch AI, with Epoch AI's confidence tag (#confident, #likely, #speculative) kept as in the file."
  null_meaning: "Epoch AI gives no owner."
- name: users
  type: string
  nullable: true
  description: "Users of the site's compute as given by Epoch AI, with its confidence tags."
  null_meaning: "Epoch AI gives no users."
- name: project
  type: string
  nullable: true
  description: "Project as given by Epoch AI, for example Stargate or Project Rainier, with its confidence tags."
  null_meaning: "Epoch AI gives no project."
- name: country_source
  type: string
  nullable: false
  description: "Country as given by Epoch AI."
- name: address_raw
  type: string
  nullable: true
  description: "Address as given by Epoch AI."
  null_meaning: "Epoch AI gives no address."
- name: power_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: >-
    Current IT power of the site in MW as given by Epoch AI: the power available to GPU servers, network
    and storage, without cooling and other facility overhead, as of the file date. 0 is a value: Epoch AI
    counts no IT power in operation at the site yet.
- name: power_basis
  type: string
  nullable: false
  allowed_values: [epoch_it_power]
  description: "epoch_it_power for all sites."
- name: power_status
  type: string
  nullable: false
  allowed_values: [found]
  description: "found for all 94 sites."
- name: power_status_reason
  type: string
  nullable: true
  description: "Reason when power_status is not found; none in this version."
  null_meaning: "power_status is found."
- name: power_ref
  type: string
  nullable: false
  description: "Site name in the Epoch AI file from which the value is taken."
- name: power_source_date
  type: date
  nullable: false
  description: "Date of the Epoch AI file."
- name: power_checked_by
  type: string
  nullable: false
  description: "Script that took the value (script:dc_power)."
- name: h100e_current
  type: number
  unit: H100 equivalents
  nullable: false
  description: "Current computing capacity of the site in H100 equivalents, as estimated by Epoch AI."
- name: capital_cost_usd_bn
  type: number
  unit: billion USD (2025)
  nullable: false
  description: "Current total capital cost of the site in billions of 2025 U.S. dollars, as estimated by Epoch AI."
- name: chip_types_current
  type: string
  nullable: true
  description: "Types of AI chips currently at the site, as given by Epoch AI."
  null_meaning: "Epoch AI gives no current chip types."
- name: selected_sources
  type: string
  nullable: false
  description: "Sources Epoch AI lists for the site, as Markdown links separated by a vertical bar ( | )."
- name: iso3_source
  type: string
  nullable: false
  description: "Country given by Epoch AI, as the ISO 3166 alpha-3 code of a unit of abf-boundaries."
- name: iso3_frame
  type: string
  nullable: true
  description: "Country of abf-boundaries v0.2.0 in which the point lies; a coastal point outside every country goes to the nearest country within 10 km."
  null_meaning: "The site has no point."
- name: control_iso3
  type: string
  nullable: true
  description: "State in control of the area of disputed control (contested_areas layer of abf-boundaries) in which the point lies."
  null_meaning: "The site does not lie in an area of disputed control."
- name: resolved_by_population
  type: boolean
  nullable: false
  description: >-
    true when several towns of that name lie in the same region and the place was chosen because only
    one of them has a population above zero in GeoNames.
- name: location_state
  type: string
  nullable: true
  allowed_values: [no_address, unresolved, ambiguous]
  description: >-
    Why the site has no point: no_address (the file gives no address and the name names no town),
    unresolved (a town is named but not found under the rules), ambiguous (several towns fit).
  null_meaning: "The site has a town point."
geometry:
  lon: lon
  lat: lat
  precision: coord_precision
  precisions: [city, none]
  precisions_without_point: [none]
unit_checks:
- {precision: none, level: ADM0}
unit_empty_for: [city]
iso3_columns: [iso3_source, iso3_frame, control_iso3]
# Fields that hold values of the source as they are (decision of ARCH6 23.10): G7 skips them and counts the cells.
g7_source_value_fields: [name, owner, users, project, address_raw, chip_types_current, selected_sources]
check_field_formats: true
expected_counts:
  rows: 94
  value_counts:
    coord_precision: {city: 71, none: 23}
  value_counts_listed:
    country_source: {"United States": 77}
  zero_counts: {power_mw: 20}
