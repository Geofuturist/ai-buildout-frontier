  record_pattern: Ilin, V. AI Buildout Frontier, layer {layer_id}, unit {record_key}, version {version}. {doi_url}
tiles:
  minzoom: 0
  maxzoom: 10
checks:
  totals_vs_source:
    kind: csv
    source_file: D:\GISData\Energy\France\odre_registre\registre-national-installation-production-stockage-electricite-agrege.csv
    separator: ;
    decimal: ','
    code_column: codeDepartement
    code_zfill: 2
    unit_prefix: FRA-2-
    filters:
    - column: dateDeraccordement
      empty: true
    - column: dateMiseEnservice (format date)
      not_after: '2026-07-31'
      keep_empty: true
    - column: regime
      not_in:
      - En retrait provisoire
    outside:
