verification:
  method: >-
    Operating installations are selected and summed by department by script from the source table,
    using the department code of each row. A row counts as operating if it has no disconnection
    date, was commissioned on or before the snapshot date, and is not temporarily withdrawn. A list
    of known closed plants stops the build for a decision; decisions are logged. No value was
    re-checked by a person or by an agent. The automated checks listed below were run on every build.
  totals_vs_source:
    exceptions:
      - {what: "rows without department code", rows: 49, mw: 34.126}
      - {what: "codes 975, 977, 978 (outside the 101 departments)", rows: 44, mw: 135.076}
freshness: {source_cadence: monthly, next_check: 2026-11-30}
coverage:
  geography: "All 101 departments, including the five overseas departments"
  known_gaps:
    - >-
      Capacity is the maximum installed power declared in the register. It is not the net summer
      capacity of EIA-860, so the French and U.S. generation layers are not directly comparable.
    - >-
      Installations without a commissioning date in the register (226 rows, 12.0 GW) are counted as
      operating. Disconnected installations (22 rows, 155.9 MW), installations commissioned after
      the snapshot date (6 rows, 1.0 MW) and installations temporarily withdrawn from service
      (6 rows, 1,007.4 MW) are not counted.
    - >-
      Installations without a department code (49 aggregated rows, 34.1 MW) and those in
      Saint-Pierre-et-Miquelon, Saint-Barthélemy and Saint-Martin (44 rows, 135.1 MW) are not in the
      department values.
    - "The register is updated monthly; the layer is a snapshot of 31 July 2026."
display: {geometry_type: polygon, value_field: installed_capacity_mw, unit: MW,
          breaks: [460, 760, 1100, 2400],   # preliminary (pre-flight quantiles); build recomputes
          zero_class: true, legend_title: "Installed capacity, MW"}
