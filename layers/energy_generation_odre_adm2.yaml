      empty_code: true
    - name: codes 975, 977, 978 (outside the 101 departments)
      codes:
      - '975'
      - '977'
      - '978'
    columns:
    - layer_column: installed_capacity_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        not_in:
        - Stockage non hydraulique
    - layer_column: storage_capacity_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Stockage non hydraulique
    - layer_column: capacity_nuclear_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Nucléaire
    - layer_column: capacity_fossil_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Thermique non renouvelable
    - layer_column: capacity_hydro_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Hydraulique
    - layer_column: capacity_wind_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Eolien
    - layer_column: capacity_solar_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Solaire
    - layer_column: capacity_bioenergy_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
      - column: filiere
        in:
        - Bioénergies
    - layer_column: capacity_other_mw
      value_column: puisMaxInstallee
      divisor: 1000
      filters:
