layer_id: energy_generation_odre_adm2
title: Generation · ODRÉ national register · department
title_ru: Генерация · национальный реестр ODRÉ · департаменты
domain: energy
level: ADM2
frame:
  iso3: FRA
  level: ADM2
  code_regex: \d{2,3}|2[AB]
  service_fields:
  - unit_id
  - name
  - coverage_status
input:
  table: data\fra\layer_generation_odre_20261010.csv
  key: unit_id
  legacy_meta: data\fra\layer_generation_odre_20261010_meta.json
  coverage_column: coverage_status
  coverage_note_column: coverage_note
description: Maximum installed capacity of the electricity generating installations listed in France's
  national register of production and storage installations (snapshot of 31 July 2026), summed by department
  and split by technology group, with storage capacity in a separate column. Only installations in operation
  on the snapshot date are counted.
fields:
- name: installed_capacity_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Sum of the maximum installed capacity (puissance maximale installée) of the operating generating
    installations in the department, storage excluded.
- name: storage_capacity_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Maximum capacity of non-hydraulic storage installations, mostly batteries. It is not part
    of installed_capacity_mw. 0 means none are listed.
- name: capacity_nuclear_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from nuclear installations. 0 means none are listed.
- name: capacity_fossil_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from non-renewable thermal installations (gas, coal, oil).
    0 means none are listed.
- name: capacity_hydro_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from hydro installations, including pumped storage as the
    source classifies it. 0 means none are listed.
- name: capacity_wind_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from wind installations. 0 means none are listed.
- name: capacity_solar_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from solar installations. 0 means none are listed.
- name: capacity_bioenergy_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from bioenergy installations. 0 means none are listed.
- name: capacity_other_mw
  type: number
  unit: MW
  nullable: false
  min: 0
  description: Part of installed_capacity_mw from marine, geothermal and other installations. 0 means
    none are listed.
- name: n_installations
  type: integer
  nullable: false
  min: 0
  description: Number of operating installations as counted in the source. Installations under 36 kW are
    aggregated in the source and counted here by the number it gives.
- name: data_snapshot_date
  type: date
  description: Date of the register snapshot.
  nullable: false
