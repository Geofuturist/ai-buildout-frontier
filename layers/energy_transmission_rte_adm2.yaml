layer_id: energy_transmission_rte_adm2
title: "Transmission lines · RTE · department"
title_ru: "ЛЭП · RTE · департаменты"
domain: energy
level: ADM2
frame: {iso3: FRA, level: ADM2}
input: {table: 'data\fra\layer_transmission_rte_20261010.csv', key: unit_id,
        legacy_meta: 'data\fra\layer_transmission_rte_20261010_meta.json',
        coverage_column: coverage_status, coverage_note_column: coverage_note}
description: >-
  Kilometres of RTE transmission line in operation inside each department of mainland France by
  voltage band, their sum, the highest voltage present, and whether the department has any line.
  Lengths are measured inside the department; a line that crosses a boundary is counted only for
  the part inside. The line geometry dates from 30 June 2023.
fields:
  - {name: km_total, type: number, unit: km, nullable: true, min: 0,
     description: "Sum of the band columns: length of line in operation inside the department, km."}
  - {name: km_lt100, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line below 100 kV (90, 63, 45 kV and below), km. 0 means none."}
  - {name: km_100_199, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line from 100 to 199 kV (150 kV in this network), km. 0 means none."}
  - {name: km_200_299, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line from 200 to 299 kV (225 kV in this network), km. 0 means none."}
  - {name: km_300_399, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line from 300 to 399 kV, km. The RTE network has no line in this band; the column keeps the bands common to all transmission layers of the project."}
  - {name: km_400_599, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line from 400 to 599 kV (400 kV in this network), km. 0 means none."}
  - {name: km_ge600, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line of 600 kV and above, km. The RTE network has no line in this band; the column keeps the bands common to all transmission layers of the project."}
  - {name: km_dc, type: number, unit: km, nullable: true, min: 0,
     description: "Length of direct-current line, km. 0 means none."}
  - {name: km_unknown, type: number, unit: km, nullable: true, min: 0,
     description: "Length of line without a usable voltage, mostly lines recorded as de-energized (hors tension), km. 0 means none."}
  - {name: max_voltage_kv, type: number, unit: kV, nullable: true,
     description: "Highest voltage among the lines inside the department that have a recorded voltage.",
     null_meaning: {covered: "The department has no line with a recorded voltage."}}
  - {name: has_any_line, type: boolean, nullable: true,
     description: "True if at least one line of the source touches the department."}
  - {name: frac_km_unknown_voltage, type: number, nullable: true, min: 0, max: 1,
     description: "Share of the line length inside the department without a usable voltage, from 0 to 1.",
     null_meaning: {covered: "The department has no line length inside it, so the share is undefined."}}
null_meaning_all_fields:
  not_covered: >-
    The RTE transmission network covers mainland France; Corsica and the overseas departments
    have separate grids that are not in this source.
  covered: null   # except max_voltage_kv and frac_km_unknown_voltage, see fields
