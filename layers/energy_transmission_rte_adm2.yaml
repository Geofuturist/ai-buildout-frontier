verification:
  method: >-
    Line lengths inside each department are computed by script from the line geometry of the
    source and classed by voltage. No value was re-checked by a person or by an agent. The automated
    checks listed below were run on every build.
  totals_vs_source: {tolerance_pct: 0.5}
freshness: {source_cadence: discontinued_geometry, next_check: 2027-06-30}
coverage:
  geography: "94 continental departments; 2A, 2B and the five overseas departments not covered"
  known_gaps:
    - >-
      The line geometry dates from 30 June 2023 (a public copy republished by DDTM de l'Eure). Since
      June 2026 RTE publishes its list of lines on ODRÉ without coordinates, citing public security:
      "RTE a fait évoluer l'accès aux données GPS des infrastructures du réseau public de transport
      pour des raisons de sécurité publique". The project therefore publishes only department totals
      and does not publish line segments.
    - >-
      Lines with an administrative approval that are not yet built (état ACCORD ADMINISTRATIF;
      159 segments, 1,467.5 km) are not included.
    - "Lines recorded as de-energized (hors tension; 1,882 km) are counted in km_unknown, without a voltage."
    - >-
      Department outlines are Natural Earth 1:10m: a line within about a kilometre of a department
      boundary may be counted in the neighbouring department. 793.5 km of line lie outside the 94
      departments (coast and international connections) and are not counted.
    - "The layer does not show how much power can flow into a department."
display: {geometry_type: polygon, value_field: km_total, unit: km,
          breaks: [650, 810, 980, 1200],   # preliminary; build recomputes
          zero_class: true, legend_title: "Transmission lines, km"}
