    product: "Lignes aériennes RTE; Lignes souterraines RTE"
    url: [https://www.data.gouv.fr/datasets/lignes-aeriennes-rte, https://www.data.gouv.fr/datasets/lignes-souterraines-rte-1]
    edition: "data at 2023-06-30"
    current_through: 2023-06-30
    publication_mode: open_licence
    license: {id: etalab-2.0, name: "Licence Ouverte v2.0", family: attribution,
              attribution_text: "Transmission lines: RTE, Lignes aériennes RTE and Lignes souterraines RTE (data as of 30/06/2023), republished by DDTM de l'Eure on data.gouv.fr, last updated 02/11/2023, Licence Ouverte v2.0 (Etalab)."}   # [RES] draft
    rights_basis: {type: license, text: "The data.gouv.fr page of the republished copy states Licence Ouverte v2.0. The line segments are withheld by the project's rule on geometry withdrawn by its operator, not by the licence."}
  - source_id: odre_rte_lignes_2026
    role: context
    product: "Lignes aériennes / souterraines RTE – nouveau découpage (au 16 juin 2026), ODRÉ — published without coordinates"
    url: https://odre.opendatasoft.com/explore/dataset/lignes-aeriennes-rte-nv/
