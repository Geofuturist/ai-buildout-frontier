  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
  sample_share: {}
  method: >-
    [RES] Draft. The places are counted by script from the published records of dc_atlas_points (abf-dc 0.1.0); the
    build stops if the counts do not add up to the 6,087 records with a town point. No new check by an agent was made:
    the layer counts records that were already checked.
