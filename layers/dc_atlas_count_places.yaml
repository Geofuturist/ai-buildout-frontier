extra_files:
- path: 'D:\GISData\AI\DC\out\abf-dc-v0.2.0\operator_type_groups.csv'
  publish_as: operator_type_groups.csv
  unique_column: operator_type
  description: >-
    The 20 operator types of the Atlas of Data Center Politics and the group under which the project shows each on
    the map, with the number of records of each type. The groups are for display only; the records keep the Atlas
    type in operator_type.
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
  sample_share: {}
  method: >-
    Places are counted by script from the published records of dc_atlas_points (abf-dc 0.1.0); a place is the
    place_ref of a record. The build stops if the records of one place differ in point, name or country, if the
    places do not add up to the 6,087 records with a town point, or if the counts by status, by size class or by
    operator-type group in a row do not add up to n_records. No new check by an agent was made: the layer only
    counts records whose places were set by rules and checked by sample in abf-dc 0.1.0, as described in
    dc_atlas_points.
freshness:
  source_cadence: irregular
  next_check: "2027-01-31"
coverage:
  geography: "Places of the 126 countries and territories listed in the Atlas national tables"
  iso3_from: iso3_source
  known_gaps:
  - >-
    A place is a town point, not a site. 4,663 records share their place with at least one other record, and
    109 places hold 10 or more records each (Shanghai 80, Beijing 70, Ashburn 57). The records of one place may
    be separate sites, buildings or phases of one site, or repeats.
  - >-
    3,778 of the 9,865 Atlas records are not in this layer: 1,583 U.S. records placed only in a county, which are
    counted in dc_atlas_count_usa_adm2, and 2,195 records without a place below the country, which are counted
    only by country (dc_atlas_count_adm0).
  - >-
    The town of each record comes from its address or its name, by the rules described in dc_atlas_points.
    1,686 of the 6,087 records with a point take their town from the record name; in a test this rule gave the
    same town as the address in 86.9% of cases.
  - "Counts follow the Atlas rows: records identical in every field are counted separately."
  - >-
    The size class is the Atlas's own, and the Atlas does not state whether it refers to IT power or to the
    whole facility. 296 of the 1,424 places with one record have the class Unknown.
  - >-
    The points of four places in border towns (Gibraltar, Sittard, Grevenmacher, Lauterbourg) fall in the
    neighboring country on the generalized 1:10 million outlines, so iso3_frame differs from iso3_source. One
    place, Simferopol, lies in Crimea, which abf-boundaries v0.2.0 shows under Russian control and records as
    claimed by Ukraine (control_iso3). Neither is a position of the project.
  - >-
    The operator type is the Atlas's type of the operator of a record, not the use of the site; we found no
    definition of the types on the Atlas pages we read. The groups are the project's (operator_type_groups.csv).
    The Atlas type AI Compute does not mark AI data centers as Epoch AI does: the 63 Epoch AI sites found in the
    Atlas match 75 Atlas records, of which 39 have the type Cloud, 24 Colocation and 10 AI Compute.
display:
  geometry_type: point
  size_field: power_class
  size_classes: [lt10, "10_99", "100_999", ge1000]
  size_breaks: [10, 100, 1000]
  count_field: n_records
  count_breaks: [2]
  legend_title: "Atlas records per place"
  legend_note: >-
    A place is a town, not a site. A place with one record is drawn by the record's operator type and size class.
    A place with two or more records has one size and shows how many records it holds.
  legend_count_classes: ["Two or more records at the town: the number is the count"]
  fan_note: >-
    Schematic: all these records share the town point. Their positions in the fan do not show where the sites are.
  legend_unknown: "One record, size class unknown"
  legend_point: "Point at the town, not at the site"
  list_title: "{n} Atlas records at {place_name}"
  list_note: "Records at one town point may be separate sites. Select a record for its details."
  color_field: type_group
  color_classes: [colocation, telecom, developer_investor, cloud, enterprise_it, ai_compute, other]
  filter_fields:
    colocation: n_type_colocation
    telecom: n_type_telecom
    developer_investor: n_type_developer_investor
    cloud: n_type_cloud
    enterprise_it: n_type_enterprise_it
    ai_compute: n_type_ai_compute
    other: n_type_other
  legend_type_title: "Atlas: operator type"
  legend_type_note: >-
    The type of the operator as the Atlas gives it, grouped by the project. It tells who runs the site, not what
    the site is used for.
  legend_type_labels:
    colocation: "Colocation"
    telecom: "Telecom"
    developer_investor: "Developer or investor"
    cloud: "Cloud"
    enterprise_it: "Enterprise or IT services"
    ai_compute: "AI compute (Atlas type)"
    other: "Other or unknown"
  legend_type_filter_all: "All types"
  tile_fields: [record_id, place_ref, place_name, n_records, power_class, n_operating_or_construction, n_planned, n_retired, n_class_lt10, n_class_10_99, n_class_100_999, n_class_ge1000, n_class_unknown, type_group, n_type_colocation, n_type_telecom, n_type_developer_investor, n_type_cloud, n_type_enterprise_it, n_type_ai_compute, n_type_other, iso3_source, control_iso3]
ref_field: ref
tiles:
  minzoom: 0
  maxzoom: 12
  # all 2,303 points at every zoom, no dropping (SPEC section 3 item 4)
  extra_args: ["-r1", "--no-tile-size-limit", "--no-feature-limit"]
