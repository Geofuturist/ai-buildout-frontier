# abf-dc v0.2.0 · new layer: Atlas records with a town point, counted by place. Texts: RES_texts_DC_v0_2_0 r2 sections 1 and 9.
# Data: scripts/dc/dc_count_v020.py (SPEC_DC_world_v0_2_0 r2 sections 2.2 and 8).
layer_id: dc_atlas_count_places
title: "Data centers · Atlas of Data Center Politics · places"
title_ru: "ЦОД · Atlas of Data Center Politics · места"
domain: dc
level: point
input:
  table: 'D:\GISData\AI\DC\out\abf-dc-v0.2.0\dc_atlas_count_places.csv'
  files:
    points_v010: 'D:\GISData\AI\DC\out\abf-dc-v0.1.0\dc_atlas_points.csv'
    geonames_cities500: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\cities500.zip'
    geonames_admin1: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\admin1CodesASCII.txt'
    geonames_country_info: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\countryInfo.txt'
    geonames_readme: 'D:\GISData\AI\DC\abf-scratch-dc\research\dc_world\inputs\geonames\Readme.txt'
    census_places_zip: 'D:\GISData\AI\DC\sources\census\2023_Gaz_place_national.zip'
    census_places_txt: 'D:\GISData\AI\DC\sources\census\2023_Gaz_place_national.txt'
    frame_adm0: 'D:\GISData\AI\DC\sources\frame\adm0.parquet'
    frame_units: 'D:\GISData\AI\DC\sources\frame\units.csv'
description: >-
  Data-center records of the Atlas of Data Center Politics that have a town point, counted by place: one row
  for each of the 2,303 towns and U.S. Census places at which the project placed at least one record of
  dc_atlas_points. A place is a town, not a site. Its records may be separate sites kilometers apart, and the
  Atlas table does not say how they relate. Each row counts the records of the place by Atlas status, size
  class and operator-type group, and for a place with one record it also gives that record's size class and
  group. The counts are made from the records of abf-dc 0.1.0, which this version publishes unchanged. The
  3,778 records without a town point are not in this layer.
fields:
- name: record_id
  type: string
  nullable: false
  description: "Identifier set by the project: PLC- and the place_ref of the place, with the colon replaced by a hyphen."
- name: place_ref
  type: string
  nullable: false
  description: "Identifier of the place: geonames:<geonameid> or census:<GEOID>."
- name: place_name
  type: string
  nullable: false
  description: "Name of the town or U.S. place, as GeoNames or the Census Gazetteer gives it."
- name: lon
  type: number
  nullable: false
  description: "Longitude of the place (WGS 84), as in dc_atlas_points."
- name: lat
  type: number
  nullable: false
  description: "Latitude of the place (WGS 84), as in dc_atlas_points."
- name: coord_precision
  type: string
  nullable: false
  allowed_values: [city]
  description: "city for every row: the place is a town point; records placed only in a county or without a place are not in this layer."
- name: iso3_source
  type: string
  nullable: false
  description: "Country under which the Atlas lists the records of the place, as the ISO 3166 alpha-3 code of a unit of abf-boundaries. The Atlas entry Somaliland is coded SOM."
- name: iso3_frame
  type: string
  nullable: false
  description: "Country of abf-boundaries v0.2.0 in which the point lies, as in dc_atlas_points."
- name: control_iso3
  type: string
  nullable: true
  description: "State in control of the area of disputed control (contested_areas layer of abf-boundaries) in which the point lies."
  null_meaning: "The place does not lie in an area of disputed control."
- name: ref
  type: string
  nullable: false
  description: "The records counted in the row: the records of dc_atlas_points (abf-dc 0.1.0) with this place_ref."
- name: checked_at
  type: datetime
  nullable: false
  description: "Date and time of the data step that counted the place."
- name: checked_by
  type: string
  nullable: false
  description: "Script that counted the place (script:dc_count_v020)."
- name: n_records
  type: integer
  nullable: false
  min: 0
  description: "Number of Atlas data-center records placed at this town."
- name: n_operating_or_construction
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas status Operating / Construction, which covers both operating sites and sites under construction."
- name: n_planned
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas status Planned."
- name: n_retired
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas status Retired."
- name: n_class_lt10
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Small (below 10 MW)."
- name: n_class_10_99
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Large (10–99 MW)."
- name: n_class_100_999
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Hyperscale (100–999 MW)."
- name: n_class_ge1000
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Gigascale (above 999 MW)."
- name: n_class_unknown
  type: integer
  nullable: false
  min: 0
  description: "Records with the Atlas size class Unknown."
- name: power_class
  type: string
  nullable: true
  allowed_values: [lt10, "10_99", "100_999", ge1000]
  description: >-
    Size class of the one record of the place, as the Atlas gives it: lt10 (Small, below 10 MW), 10_99 (Large,
    10–99 MW), 100_999 (Hyperscale, 100–999 MW), ge1000 (Gigascale, above 999 MW). Given only for a place with
    one record; for more records the classes are in the n_class_ columns.
  null_meaning: >-
    The place has two or more records (n_records > 1), or its one record has the Atlas size class Unknown
    (n_records = 1).
- name: type_group
  type: string
  nullable: true
  allowed_values: [colocation, telecom, developer_investor, cloud, enterprise_it, ai_compute, other]
  description: >-
    Operator-type group of the one record of the place (see operator_type_groups.csv); empty for a place with two or
    more records.
  null_meaning: "The place has two or more records (n_records > 1)."
- name: n_type_colocation
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is Colocation."
- name: n_type_telecom
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is Telecom."
- name: n_type_developer_investor
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is Developer, Asset Manager, Private Equity, Lender or Construction."
- name: n_type_cloud
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is Cloud."
- name: n_type_enterprise_it
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is Managed IT, Enterprise or Fintech."
- name: n_type_ai_compute
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is AI Compute."
- name: n_type_other
  type: integer
  nullable: false
  min: 0
  description: "Records whose Atlas operator type is Crypto, Energy, Utility, Public, Government, Education, Regulator or Unknown."
geometry:
  lon: lon
  lat: lat
  precision: coord_precision
  precisions: [city]
  precisions_without_point: []
iso3_columns: [iso3_source, iso3_frame, control_iso3]
g7_source_value_fields: []
check_field_formats: true
# Numbers of SPEC_DC_world_v0_2_0 section 2.4 and section 8 item 4 (also stated in the texts of RES7); a difference stops the final build.
expected_counts:
  rows: 2303
  sums: {n_records: 6087, n_type_colocation: 2774, n_type_telecom: 1089, n_type_developer_investor: 671, n_type_cloud: 562, n_type_enterprise_it: 386, n_type_ai_compute: 138, n_type_other: 467}
  value_counts_listed:
    coord_precision: {city: 2303}
    type_group: {colocation: 474, telecom: 233, developer_investor: 253, cloud: 115, enterprise_it: 124, ai_compute: 39, other: 186}
