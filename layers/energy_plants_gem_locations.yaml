verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
    agent_sample: 0.0
  sample_share: {}
  method: 'Rows are built by script from the units of energy_plants_gem_units only. Units of a plant are taken in the order
    of their IDs; each unit joins the first group of the plant whose first unit lies within 1 km of it, or starts a new
    group. The build stops if the rows do not add up to the 164,672 units, if the capacity by type and status differs from
    the units, or if units of one plant differ in name or GEM.wiki page. A second run gives byte-identical files. No check
    by an agent was made: the layer groups GEM''s records without changing their values.'
freshness:
  source_cadence: irregular
  next_check: '2027-01-31'
coverage:
  geography: Power plants of the world (Global Energy Monitor)
  iso3_from: iso3_source
  known_gaps:
  - 'A row is not always a whole plant: a plant is split by type, by status and by point. capacity_mw adds the units of
    one row only.'
  - 'Thresholds by type and the dates of GEM''s trackers: as in energy_plants_gem_units. Smaller plants and distributed
    solar below 1 MW are not in the layer.'
  - 67,148 of the 138,504 rows (48.5%) take their point from a unit whose location GEM gives as approximate, based on “using
    nearest city or other information in research”. The map does not set these points apart; the plant window says which they
    are.
  - Many approximate points are shared by several plants. 134 points carry 20 or more different GEM plants each, 5,198 different
    plants in all, 3,941 of them in China; the largest, at 120°E, 33°N in Jiangsu, carries 165. Such a point is GEM's approximate
    location, not the site of any of these plants.
  - Units of one plant can have different points. Where they are more than 1 km apart, the rows are kept apart rather than
    averaged. For 399 GEM plants the latitudes or longitudes of the units differ by more than 1°; some of these may be errors
    in the source, which the project does not correct.
  - The country is given by GEM's table and by the point. 3,256 rows lie outside the generalized country outlines but within
    22.2 km of a country and get the nearest one. For 233 rows the point lies in another country of the frame than the one
    GEM names, among them 23 rows in Crimea or just off its coast (Ukraine in GEM; Russia in the frame). 20 of them lie inside
    the area of disputed control, where the frame records Ukraine's claim (control_iso3); 3 offshore wind farms share one
    approximate point at sea and get Russia by the 22.2 km rule without control_iso3. Neither is a position of the project.
  - 'Hydropower includes pumped storage, and offshore wind is not a type of its own: both are told apart only in technologies.'
  - Solar capacity mixes AC and DC values. Of the 79,730 solar rows, 26,698 hold only units given in MWac, 21,774 only units
    in MWp/dc, 31,037 only units of unknown basis, and 221 a mix.
  - The statuses shelved - inferred 2 y and cancelled - inferred 4 y are GEM's inference from lack of observed progress,
    not a report by the owner; 4,935 rows contain such units.
  - 'The 18,732 units that GEM marks as sourced from TransitionZero''s Solar Asset Mapper are in energy_plants_gem_tzsam_locations
    (abf-energync, CC BY-NC 4.0). 15 plants have units in both datasets: 29 rows here and 17 there, marked by n_units_other_set.'
  - In the United States, this layer and the project's layers from Form EIA-860 are separate sources and are not reconciled.
  - 'Data-center flags are GEM''s, and the project does not check them: 226 rows hold units that GEM lists as captive plants
    of a data center, 22 rows units with a power purchase agreement with a data center. capacity_mw of such a row counts
    all its units, flagged or not; n_units_dc_link gives the number of flagged units.'
display:
  geometry_type: point
  color_field: type
  color_classes: *id001
  legend_type_labels:
    coal: Coal
    oil/gas: Oil and gas
    utility-scale solar: Utility-scale solar
    wind: Wind (onshore and offshore)
    hydropower: Hydropower (incl. pumped storage)
    nuclear: Nuclear
    bioenergy: Bioenergy
    geothermal: Geothermal
  size_field: capacity_class
  size_classes:
  - lt10
  - '10_99'
  - '100_999'
  - ge1000
  size_breaks:
  - 10
  - 100
  - 1000
  legend_size_labels:
    lt10: Under 10 MW
    '10_99': 10–99 MW
    '100_999': 100–999 MW
    ge1000: 1,000 MW and more
  class_minzoom:
    ge1000: 0
    '100_999': 3
    '10_99': 4
    lt10: 5
  legend_title: Power plants (GEM)
  legend_note: Symbol size shows capacity; smaller plants appear as you zoom in. About half of the points (48.5%) are approximate,
    as stated by GEM; the plant window says which.
  legend_approximate: Approximate location (as stated by GEM)
  filters:
  - field: status_group
    mode: equals
    default: operating
    title: Status (GEM)
    note: Operating by default; tick more statuses to add them. Shelved and Cancelled include plants that GEM infers to be stalled
      after two or four years without observed progress.
    values:
    - value: announced
      label: Announced
    - value: pre_construction
      label: Pre-construction
    - value: construction
      label: Construction
    - value: operating
      label: Operating
    - value: shelved
      label: Shelved
    - value: cancelled
      label: Cancelled
    - value: mothballed
      label: Mothballed
    - value: retired
      label: Retired
  - field: dc_links
    mode: contains
    default: null
    title: Data-center flags (GEM)
    note: Data-center flags are GEM's; the project does not check them.
    values:
    - value: captive_dc
      label: Captive plant serving a data center (flagged by GEM)
    - value: dc_ppa
      label: Power purchase agreement with a data center (flagged by GEM)
  tile_fields:
  - record_id
  - plant_name
  - wiki_url
  - type
  - status_group
  - statuses
  - technologies
  - capacity_mw
  - capacity_class
  - n_units
  - capacity_ratings
  - start_year_min
  - start_year_max
  - coord_precision
  - n_units_dc_link
  - dc_links
  popup:
  - text: '{capacity_mw} MW · {n_units} unit(s)'
  - text: 'Status (GEM): {statuses}'
  - text: 'Technology: {technologies}'
    when:
      field: technologies
      nonempty: true
  - text: 'Capacity basis: {capacity_ratings}'
    when:
      field: capacity_ratings
      nonempty: true
  - text: 'Start year: {start_year_min}'
    when:
      field: start_year_min
      nonempty: true
  - text: 'Latest start year: {start_year_max}'
    when:
      field: start_year_max
      ne_field: start_year_min
  - text: 'Location: exact (as stated by GEM)'
    when:
      field: coord_precision
      equals: site
  - text: Approximate location (as stated by GEM)
    when:
      field: coord_precision
      equals: approximate
  - text: 'GEM lists this plant as captive power for a data center: a plant within the facility that typically supplies
      most of its power to it.'
    when:
      field: dc_links
      contains: captive_dc
  - text: GEM lists this unit as connected to a data center through a power purchase agreement.
    when:
      field: dc_links
      contains: dc_ppa
  - text: '{n_units_dc_link} of {n_units} units flagged by GEM'
    when:
      field: n_units_dc_link
      gt: 0
      ne_field: n_units
  - text: '“Inferred”: GEM''s inference from lack of observed progress, not a report by the owner.'
    when:
      field: statuses
      contains: inferred
  - text: Part of this plant is in the other GEM layer.
    when:
      field: n_units_other_set
      gt: 0
  - text: 0 MW, as given by GEM
    when:
      field: capacity_mw
      equals: 0
  - link: wiki_url
    text: Plant page on GEM.wiki
  popup_title: '{plant_name}'
ref_field: wiki_url
tiles:
  minzoom: 0
  maxzoom: 10
citation:
  text: Ilin, V. ({year}). AI Buildout Frontier · {title} (version {version}) [Data set]. Zenodo. {doi_url}
  record_pattern: Ilin, V. AI Buildout Frontier, layer {layer_id}, record {record_key}, version {version}. {doi_url}
