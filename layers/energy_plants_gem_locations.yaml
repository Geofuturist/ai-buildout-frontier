    iso3_frame_rule:
      nearest_12nmi: 3256
      within: 134472
      (empty): 776
  value_counts_listed:
    status_group:
      operating: 93715
  nonempty_counts:
    control_iso3: 20
    dc_links: 248
  distinct_counts:
    location_id: 126886
