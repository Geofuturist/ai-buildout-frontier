# abf-energy / abf-energync 0.1.0. Texts: claude/RES_texts_GEM_v0_1_0.md r1 (sections 1-7), word for word.
# Build rules: claude/SPEC_GEM_plants_v0_1_0.md r7 (sections 3, 3a, 3b). Generated by the one-off script gen_gem_yaml.py; edit the yaml by hand afterwards.
layer_id: energy_plants_gem_locations
title: Power plants · Global Energy Monitor · plants
title_ru: Электростанции · Global Energy Monitor · станции
domain: energy
level: point
uses_boundary_frame: true
input_columns_exact: true
csv_identical_to_input: true
input:
  table: data\gem\energy_plants_gem_locations.csv
  files:
    gem_xlsx: D:\GISData\Energy\GEM\Global Integrated Power September 2026 V2.xlsx
description: 'The units of energy_plants_gem_units grouped for the map. A row holds the units of one GEM plant that have
  the same type and the same GEM base status and lie at one point; its capacity is their sum. A plant with units of several
  types or statuses therefore has several rows, for example one for its operating units and one for a unit under construction.
  Units of one plant whose points lie more than 1 km apart form separate rows (3,364 plants). The point of a row is the
  point GEM gives for its first unit, the one with the lowest GEM unit/phase ID, so the layer has no coordinates of its
  own. 138,504 rows from 126,886 GEM plants; 93,715 rows are operating, with 8,634,628 MW. Capacity should be compared within
  one status: the layer also holds announced, cancelled and retired units.'
fields:
- name: record_id
  type: string
  nullable: false
  description: 'Key of the row: location_id, type and GEM base status (for example L100000905592-wind-operating). Where
    the units of the plant lie at more than one point, every row of the plant ends in -p1, -p2 and so on.'
- name: location_id
  type: string
  nullable: false
  description: 'GEM location ID: GEM''s key of the plant.'
- name: plant_name
  type: string
  nullable: false
  description: Name of the plant or project, as GEM gives it.
- name: wiki_url
  type: string
  nullable: false
  description: Page of the plant on GEM.wiki, with GEM's references.
- name: type
  type: string
  nullable: false
  allowed_values: &id001
  - coal
  - oil/gas
  - utility-scale solar
  - wind
  - hydropower
  - nuclear
  - bioenergy
  - geothermal
  description: GEM type of the units in the row.
- name: status_group
  type: string
  nullable: false
  allowed_values:
  - announced
  - pre_construction
  - construction
  - operating
  - shelved
  - cancelled
  - mothballed
  - retired
  description: GEM base status of the units in the row.
- name: statuses
  type: string
  nullable: false
  description: GEM statuses of the units in the row, as GEM gives them, separated by “; ” (for example cancelled; cancelled
    - inferred 4 y).
- name: technologies
  type: string
  nullable: true
  description: Technologies of the units in the row, separated by “; ”.
  null_meaning: GEM gives no technology for the units. All bioenergy rows are without one.
- name: capacity_mw
  type: number
  nullable: false
  description: Sum of the capacity of the units in the row, in MW.
- name: capacity_class
  type: string
  nullable: false
  allowed_values:
  - lt10
  - '10_99'
  - '100_999'
  - ge1000
  description: 'Size class of capacity_mw: lt10 (under 10 MW), 10_99 (10 to under 100 MW), 100_999 (100 to under 1,000 MW),
    ge1000 (1,000 MW and more).'
- name: n_units
  type: integer
  nullable: false
  description: Number of units in the row.
- name: capacity_ratings
  type: string
  nullable: true
  description: 'Solar only: capacity ratings of the units in the row (MWac, MWp/dc, unknown), separated by “; ”.'
  null_meaning: Not solar.
- name: start_year_min
  type: integer
  nullable: true
  description: Earliest start year among the units in the row.
  null_meaning: No unit of the row has a start year in GEM.
- name: start_year_max
  type: integer
  nullable: true
  description: Latest start year among the units in the row.
  null_meaning: No unit of the row has a start year in GEM.
- name: iso3_gem
  type: string
  nullable: false
  description: As for the first unit of the row (see description).
- name: iso3_source
  type: string
  nullable: false
  description: As for the first unit of the row.
- name: iso3_frame
  type: string
  nullable: true
  description: As for the first unit of the row; the point of the row is that unit's point.
  null_meaning: The point lies more than 22.2 km from the land of any country of the frame (776 rows, 729 of them offshore
    wind).
- name: iso3_frame_rule
  type: string
  nullable: true
  allowed_values:
  - within
  - nearest_12nmi
  description: As for the first unit of the row.
  null_meaning: No country of the frame within 22.2 km (iso3_frame is empty).
- name: control_iso3
  type: string
  nullable: true
  description: As for the first unit of the row.
  null_meaning: The point does not lie in an area of disputed control.
- name: subnational_unit
  type: string
  nullable: true
  description: States or provinces of the units in the row, separated by “; ”.
  null_meaning: GEM names no state or province for the units.
- name: location_accuracy
  type: string
  nullable: false
  allowed_values:
  - exact
  - approximate
  description: 'As GEM gives it for the first unit of the row: exact or approximate.'
- name: coord_precision
  type: string
  nullable: false
  allowed_values:
  - site
  - approximate
  description: site or approximate, as for the first unit of the row.
- name: coord_source
  type: string
  nullable: false
  allowed_values:
  - gem
  description: 'gem: the point is GEM''s.'
- name: lon
  type: number
  nullable: false
  description: Longitude of the first unit of the row, as GEM gives it.
- name: lat
  type: number
  nullable: false
  description: Latitude of the first unit of the row, as GEM gives it.
- name: n_units_dc_link
  type: integer
  nullable: false
  description: Number of units in the row that carry a data-center flag of GEM.
- name: dc_links
  type: string
  nullable: true
  description: Data-center flags of those units (captive_dc, dc_ppa), separated by “; ”.
  null_meaning: No unit of the row carries a data-center flag of GEM.
- name: n_units_other_set
  type: integer
  nullable: false
  description: 'Number of units of the same GEM plant that are in the other dataset: abf-energync for rows of abf-energy,
    and abf-energy for rows of abf-energync.'
geometry:
  lon: lon
  lat: lat
  precision: coord_precision
  precisions:
  - site
  - approximate
  precisions_without_point: []
iso3_columns:
- iso3_source
- iso3_frame
- control_iso3
g7_source_value_fields:
- subnational_unit
