verification:
  method: Rows for electricity and 2024 are summed by region and sector by script from the source's dataset by region.
    The 18 regions add up to the total of the file. Region totals were compared with the sum of the department values
    of the same source. No value was re-checked by a person or by an agent. The automated checks listed below were
    run on every build.
  totals_vs_source:
    exceptions: []
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  sample_share: {}
freshness:
