description: 'Electricity delivered to consumers in 2024 in each region, in MWh, as reported by the grid
  operators and published by Agence ORE in its dataset by region, with the split by sector and the number
  of delivery points. The total includes consumers on the transmission network and on distribution networks.
  This is annual metered energy, not peak power: it is not comparable with the modeled peak demand of
  the U.S. demand layer.'
fields:
- name: consumption_mwh
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Electricity delivered in the region in the year, in MWh.
- name: consumption_mwh_residential
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to households.
- name: consumption_mwh_tertiary
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to services and public administration.
- name: consumption_mwh_industry
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to industry.
- name: consumption_mwh_agriculture
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh delivered to agriculture.
- name: consumption_mwh_unknown
  type: number
  unit: MWh
  nullable: false
  min: 0
  description: Part of consumption_mwh whose sector is not known to the grid operator.
- name: n_delivery_points
  type: integer
  nullable: false
  min: 0
  description: Number of delivery points (sites) as counted in the source.
- name: n_rows_without_value
  type: integer
  nullable: false
  min: 0
  description: Number of region × sector rows that the source publishes without a consumption value. 0
    in every region of this edition.
- name: data_year
  type: integer
  description: Year of the consumption data.
