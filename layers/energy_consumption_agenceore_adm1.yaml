description: 'Electricity delivered to consumers in 2024 in each region, in MWh, as reported by the grid operators
  and published by Agence ORE in its dataset by region, with the split by sector and the number of delivery points.
  The total includes consumers on the transmission network and on distribution networks. This is annual metered
  energy, not peak power: it is not comparable with the modeled peak demand of the U.S. demand layer.'
