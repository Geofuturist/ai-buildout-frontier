  next_check: 2027-01-31
coverage:
  geography: All 18 regions
  known_gaps:
  - Region values come from Agence ORE's dataset by region, a separate extract from its dataset by department. Nationally
    they are 0.10% higher than the sum of the departments, and in no region does the difference exceed 1%. The source
    does not explain the difference.
