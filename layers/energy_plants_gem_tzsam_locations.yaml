extra_files:
- path: data\gem\rules\gem_status_groups.csv
  publish_as: gem_status_groups.csv
  unique_column: status
  description: 'The table of GEM statuses: each of GEM''s ten statuses and the GEM base status (status_group) and label
    that the project assigns to it.'
- path: data\gem\rules\gem_country_table.csv
  publish_as: gem_country_table.csv
  unique_column: gem_country_name
  description: 'The country table of GEM''s own file (sheet Regions, area, and countries): the name of each country or area
    and its ISO 3166-1 alpha-3 code (iso3_gem).'
- path: data\gem\rules\gem_iso3_to_adm0.csv
  publish_as: gem_iso3_to_adm0.csv
  unique_column: iso3_gem
  description: 'The territories that GEM lists separately and the boundary frame includes in a country: iso3_gem, the code
    of the country of the frame (iso3_source) and the reason.'
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
    agent_sample: 0.0
  sample_share: {}
  method: Rows are built by script from the units of energy_plants_gem_tzsam_units only, by the rule of energy_plants_gem_locations.
    The build stops if the rows do not add up to the 18,732 units or to their capacity by status. A second run gives byte-identical
    files.
freshness:
  source_cadence: irregular
  next_check: '2027-01-31'
coverage:
  geography: Solar plants of the world (GEM / TransitionZero)
  iso3_from: iso3_source
  known_gaps:
  - Only the TZ-SAM records that GEM took into its tracker, with GEM's solar threshold; all rows are 20 MW or less, so on
    the map the layer appears only from zoom level 5.
  - 426 rows (2.3%) have a point that GEM gives as approximate.
  - '15 plants have units in both datasets: 17 rows here and 29 in energy_plants_gem_locations (abf-energy), marked by n_units_other_set.'
  - 'Country, capacity basis, owners and technology: as in energy_plants_gem_tzsam_units.'
display:
  geometry_type: point
  symbol: square
  color_field: type
  color_classes: *id001
  legend_type_labels:
    coal: Coal
    oil/gas: Oil and gas
    utility-scale solar: Utility-scale solar
    wind: Wind (onshore and offshore)
    hydropower: Hydropower (incl. pumped storage)
    nuclear: Nuclear
    bioenergy: Bioenergy
    geothermal: Geothermal
  size_field: capacity_class
  size_classes:
  - lt10
  - '10_99'
  - '100_999'
  - ge1000
  size_breaks:
  - 10
  - 100
  - 1000
  legend_size_labels:
    lt10: Under 10 MW
    '10_99': 10–99 MW
    '100_999': 100–999 MW
    ge1000: 1,000 MW and more
  class_minzoom:
    ge1000: 0
    '100_999': 3
    '10_99': 5
    lt10: 7
  legend_title: Solar plants (GEM / TransitionZero)
  legend_note: Square size shows capacity; smaller plants appear as you zoom in.
  legend_approximate: Approximate location (as stated by GEM)
  filters:
  - field: status_group
    mode: equals
    default: operating
    title: Status (GEM)
    note: One status at a time. Shelved and Cancelled include plants that GEM infers to be stalled after two or four years
      without observed progress.
    values:
    - value: announced
      label: Announced
    - value: pre_construction
      label: Pre-construction
    - value: construction
      label: Construction
    - value: operating
      label: Operating
    - value: shelved
      label: Shelved
    - value: cancelled
      label: Cancelled
    - value: mothballed
      label: Mothballed
    - value: retired
      label: Retired
  - field: dc_links
    mode: contains
    default: null
    title: Data-center flags (GEM)
    note: Data-center flags are GEM's; the project does not check them.
    values:
    - value: captive_dc
      label: Captive plant serving a data center (flagged by GEM)
    - value: dc_ppa
      label: Power purchase agreement with a data center (flagged by GEM)
  tile_fields:
  - record_id
  - plant_name
  - wiki_url
  - type
  - status_group
  - statuses
  - technologies
  - capacity_mw
  - capacity_class
  - n_units
  - capacity_ratings
  - start_year_min
  - start_year_max
  - coord_precision
  - n_units_dc_link
  - dc_links
  popup:
  - text: '{capacity_mw} MW · {n_units} unit(s)'
  - text: 'Status (GEM): {statuses}'
  - text: 'Technology: {technologies}'
    when:
      field: technologies
      nonempty: true
  - text: 'Capacity basis: {capacity_ratings}'
    when:
      field: capacity_ratings
      nonempty: true
  - text: 'Start year: {start_year_min}'
    when:
      field: start_year_min
      nonempty: true
  - text: 'Latest start year: {start_year_max}'
    when:
      field: start_year_max
      ne_field: start_year_min
  - text: 'Location: exact (as stated by GEM)'
    when:
      field: coord_precision
      equals: site
  - text: Approximate location (as stated by GEM)
    when:
      field: coord_precision
      equals: approximate
  - text: 'GEM lists this plant as captive power for a data center: a plant within the facility that typically supplies
      most of its power to it.'
    when:
      field: dc_links
      contains: captive_dc
  - text: GEM lists this unit as connected to a data center through a power purchase agreement.
    when:
      field: dc_links
      contains: dc_ppa
  - text: '{n_units_dc_link} of {n_units} units flagged by GEM'
    when:
      field: n_units_dc_link
      gt: 0
      ne_field: n_units
  - text: '“Inferred”: GEM''s inference from lack of observed progress, not a report by the owner.'
    when:
      field: statuses
      contains: inferred
  - text: Part of this plant is in the other GEM layer.
    when:
      field: n_units_other_set
      gt: 0
  - text: 0 MW, as given by GEM
    when:
      field: capacity_mw
      equals: 0
  - link: wiki_url
    text: Plant page on GEM.wiki
  popup_title: '{plant_name}'
  zoom_hint:
    text: Zoom in to see these plants.
  license_note: CC BY-NC 4.0 — non-commercial use only
  map_attribution: 'Solar records: TransitionZero Solar Asset Mapper, August 2025, via Global Energy Monitor · CC BY-NC
    4.0'
ref_field: wiki_url
tiles:
  minzoom: 0
  maxzoom: 10
citation:
  text: Ilin, V. ({year}). AI Buildout Frontier · {title} (version {version}) [Data set]. Zenodo. {doi_url}
  record_pattern: Ilin, V. AI Buildout Frontier, layer {layer_id}, record {record_key}, version {version}. {doi_url}
