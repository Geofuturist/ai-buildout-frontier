description: >-
  [RES] Draft. Number of data-center records of the Atlas of Data Center Politics for each of the 3,144 U.S. counties
  and county equivalents, counted under the county the record names (adm1_raw and adm2_raw), not by the point of the
  record. 0 means that no Atlas record names the county. 17 units are not covered: the 9 Connecticut planning
  regions and 8 units of 4 pairs of counties and independent cities that records name by one shared name.
