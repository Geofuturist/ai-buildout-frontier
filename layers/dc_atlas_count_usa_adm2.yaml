source_archives: []
extra_files:
- path: 'D:\GISData\AI\DC\out\abf-dc-v0.2.0\county_records.csv'
  publish_as: county_records.csv
  unique_column: record_id
  description: >-
    [RES] Draft. One row for each of the 4,038 Atlas records of the United States: the county it is counted under
    (unit_id, for assignment matched) or the reason it is counted under none (no_state, connecticut, no_county_field,
    ambiguous_name with the two candidates, not_matched).
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
  sample_share: {}
  method: >-
    [RES] Draft. The records are assigned to counties by script, with the rule of step 4 of the place chain of
    dc_atlas_points: the exact county name within the state, then the name without the unit-type word; two candidates
    mean no county. That rule was confirmed on 156 of 156 county placements in the check of abf-dc 0.1.0. The build
    stops if the counts do not add up to the 3,914 records assigned to a county.
freshness:
  source_cadence: irregular
  next_check: "2027-01-31"
coverage:
  geography: "All 3,144 U.S. counties and county equivalents of abf-boundaries v0.2.0 (the 17 not covered units are listed in coverage_note)"
  known_gaps:
  - "[RES] Draft. 124 of the 4,038 Atlas records of the United States are counted under no county (county_records.csv)."
display:
  geometry_type: polygon
  value_field: n_records
  unit: records
  zero_class: true
  breaks_fixed: true
  breaks: [1, 3, 10, 30, 100]   # SPEC_DC_world_v0_2_0 section 3 item 5: classes 1-2 / 3-9 / 10-29 / 30-99 / 100+ give 482 / 240 / 71 / 16 / 3 counties; V may move them after the preview
  legend_title: "[RES] Draft: records by county"
  home_bbox_from:      # contiguous states and the District of Columbia: the layer covers all 50 states, its bbox crosses the date line
    iso3: USA
    level: ADM2
    code_regex: '(?!02|15)\d{5}'
  tile_fields: [n_records, n_operating_or_construction, n_planned, n_retired, n_class_lt10, n_class_10_99, n_class_100_999, n_class_ge1000, n_class_unknown]
