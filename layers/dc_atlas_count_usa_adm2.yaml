description: >-
  Number of data-center records of the Atlas of Data Center Politics for each of the 3,144 U.S. counties and
  county equivalents of abf-boundaries v0.2.0. A record is counted under the county it names itself (its state
  and county fields), not by the point the project gave it, so records with and without a town point count
  alike: 3,914 of the 4,038 U.S. records name a county that the rule identifies. 0 means that no Atlas record
  names the county; it does not mean that the county has no data centers. 17 units are not covered, because the
  Atlas names them in a way that cannot be assigned to one unit: the 9 Connecticut planning regions and both
  units of four pairs of a county and an independent city with the same name. county_records.csv gives, record
  by record, the county each U.S. record is counted under or the reason it is counted under none.
