extra_files:
- path: 'D:\GISData\AI\DC\out\abf-dc-v0.2.0\county_records.csv'
  publish_as: county_records.csv
  unique_column: record_id
  description: >-
    One row for each of the 4,038 Atlas records of the United States in dc_atlas_points: the county it is counted
    under (unit_id, where assignment is matched) or the reason it is counted under none: no_state (the record gives
    no state), connecticut (a Connecticut record, see coverage_note), no_county_field (the record gives no county),
    ambiguous_name (the name fits a county and an independent city; both are in candidates), not_matched (the name
    fits no unit of the state; none in this version). The county counts can be rebuilt from this file.
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
  sample_share: {}
  method: >-
    Records are assigned to counties by script, with the rule of step 4 of the place chain of dc_atlas_points:
    the exact county name within the state the record names, then the same name without the word for the unit
    type (County, Parish, Borough, Census Area, Municipality, Municipio); a name that fits two units gives no
    county. The independent check of abf-dc 0.1.0 confirmed this rule on 156 of 156 sampled county placements,
    and all 1,583 records that 0.1.0 placed by county receive the same county here. No new check by an agent was
    made: the layer counts records already published and checked. The build stops if the assigned and unassigned
    records do not add up to the 4,038 U.S. records, or the counts of the units to the 3,914 assigned records.
    As a report, the build also compared each town point with the county its record names (see known gaps).
freshness:
  source_cadence: irregular
  next_check: "2027-01-31"
coverage:
  geography: >-
    All 3,144 U.S. counties and county equivalents of abf-boundaries v0.2.0; the 17 units not covered are
    explained in coverage_note.
  known_gaps:
  - >-
    Records are counted under the county they name, not by their point. For 160 of the 2,331 U.S. records that
    have both a town point and a county the rule identifies, the point lies in another county than the one the
    record names. A town given in a postal address can lie across a county line from the site.
  - >-
    124 of the 4,038 U.S. records are counted under no county: 70 give a name that a county and an independent
    city of the same state share, without saying which they mean (Fairfax, Virginia, 46; Baltimore, Maryland, 14;
    St. Louis, Missouri, 9; Franklin, Virginia, 1); 21 are in Connecticut; 32 give no county; 1 gives no state.
    They are listed in county_records.csv and counted in the country count.
  - >-
    17 units are shown as not covered rather than 0. The Atlas gives Connecticut's eight historical counties,
    which the U.S. Census Bureau replaced with nine planning regions as county equivalents in 2022, and the
    boundary frame has the planning regions. For each of the four county and city pairs, records that may refer
    to either unit cannot be assigned, so a count for either would be too low.
  - >-
    The Atlas states that absence from it should not be read as evidence that a facility does not exist. 2,315
    counties have 0 records.
  - "Counts follow the Atlas rows: records identical in every field are counted separately."
display:
  geometry_type: polygon
  value_field: n_records
  unit: records
  zero_class: true
  breaks_fixed: true
  breaks: [1, 3, 10, 30, 100]   # SPEC_DC_world_v0_2_0 section 3 item 5: classes 1-2 / 3-9 / 10-29 / 30-99 / 100+ give 482 / 240 / 71 / 16 / 3 counties; V may move them after the preview
  legend_title: "Atlas records by county"
  legend_note: >-
    Counted by the county each record names, not by its point. 0: no Atlas record names the county. Not covered:
    records cannot be assigned to the unit (see its card).
  home_bbox_from:      # contiguous states and the District of Columbia: the layer covers all 50 states, its bbox crosses the date line
    iso3: USA
    level: ADM2
    code_regex: '(?!02|15)\d{5}'
  tile_fields: [n_records, n_operating_or_construction, n_planned, n_retired, n_class_lt10, n_class_10_99, n_class_100_999, n_class_ge1000, n_class_unknown]
tiles: {minzoom: 0, maxzoom: 10}
