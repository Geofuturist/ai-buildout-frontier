# Layer config: peak demand, NREL OEDI 8562, county level.
layer_id: energy_demand_nrel8562_adm2
title: "Demand · NREL OEDI 8562 · county"
title_ru: "Спрос · NREL OEDI 8562 · округа"
domain: energy
level: ADM2
frame: {iso3: USA, level: ADM2}
input:
  table: 'data\conus\layer_demand_nrel8562_20260912.csv'
  key: fips
  legacy_meta: 'data\conus\layer_demand_nrel8562_meta.json'
description: >-
  Highest hourly electricity demand in 2023 for each county, in MW, taken from the modeled
  county-level demand profiles of NREL OEDI submission 8562. Alaska and Hawaii are not processed
  and have empty values.
fields:
  - name: peak_demand_mw
    type: number
    unit: MW
    nullable: true
    null_meaning:
      not_covered: "The county is outside the contiguous United States and the District of Columbia; it was not processed."
      covered: null
    description: "Highest hourly demand of the county in 2023. The profile is modeled, not metered."
    min: 0
sources:
