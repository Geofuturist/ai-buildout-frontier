# Layer config: peak demand, NREL OEDI 8562, county level.
layer_id: energy_demand_nrel8562_adm2
title: "Demand · NREL OEDI 8562 · county"
title_ru: "Спрос · NREL OEDI 8562 · округа"
domain: energy
level: ADM2
frame: {iso3: USA, level: ADM2}
