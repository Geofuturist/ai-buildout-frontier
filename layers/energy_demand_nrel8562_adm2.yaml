  table: 'data\conus\layer_demand_nrel8562_20260912.csv'
  key: fips
  legacy_meta: 'data\conus\layer_demand_nrel8562_meta.json'
description: >-
  Highest hourly electricity demand of each county in 2023, in MW, from the modeled county demand
  profiles of OEDI submission 8562 (National Laboratory of the Rockies, formerly NREL). Alaska and
  Hawaii are not covered and have empty values.
fields:
  - name: peak_demand_mw
    type: number
    unit: MW
    nullable: true
    null_meaning:
      not_covered: "The county is in Alaska or Hawaii, which this release does not cover; it was not processed."
      covered: null
    description: "Highest hourly demand of the county in 2023. The profile is modeled, not metered."
    min: 0
