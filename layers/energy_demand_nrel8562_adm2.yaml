    role: primary
    publisher: "National Laboratory of the Rockies (NLR)"
    product: "OEDI submission 8562: hourly electricity demand profiles for U.S. counties (Obika, Cole, Rivers)"
    url: "https://data.openei.org/submissions/8562"
    edition: "published 2025-11-05, demand year 2023"
    retrieved_at: legacy_meta
    current_through: "2023-12-31"
    input_refs: [table]
    license:
      id: CC-BY-4.0
      name: Creative Commons Attribution 4.0 International
      url: "https://creativecommons.org/licenses/by/4.0/"
      family: attribution
