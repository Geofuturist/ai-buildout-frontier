freshness: {source_cadence: static, next_check: null}
coverage:
  geography: "Contiguous United States and the District of Columbia"
  known_gaps:
    - "Alaska and Hawaii are not covered."
    - "County demand in this dataset is modeled: utilities do not meter or publish demand by county."
    - "Large single loads, data centers among them, may be under-represented, especially in counties with few residents."
verification:
  levels: {source_as_is: 1.0, script_rules: 0.0, human: 0.0}
  method: >-
    The yearly maximum of the hourly profile of each county is computed by script from the source
    table. No value was re-checked by a person or by an agent. The automated checks listed below
    were run on every build.
  sample_share: {}
display:
  geometry_type: polygon
  value_field: peak_demand_mw
  unit: MW
  breaks: [25, 50, 100, 250]
  zero_class: false
  legend_title: "Peak hourly demand, 2023, MW"
  tile_fields: [unit_id, name, coverage_status, peak_demand_mw]
tiles: {minzoom: 0, maxzoom: 10}
