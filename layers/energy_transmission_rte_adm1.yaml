verification:
  method: Line lengths inside each region are computed by script from the line geometry of the source and classed
    by voltage, with the same rules as the department layer; frac_km_unknown_voltage is computed from kilometers,
    not averaged over departments. Region totals were checked against the sum of the department totals. No value
    was re-checked by a person or by an agent. The automated checks listed below were run on every build.
  totals_vs_source:
    tolerance_pct: 0.01
  levels:
    source_as_is: 1.0
    script_rules: 0.0
    human: 0.0
  sample_share: {}
freshness:
  source_cadence: discontinued
  next_check: null
coverage:
  geography: 12 continental regions; Corse (94) and the five overseas regions not covered
  known_gaps:
  - 'The line geometry dates from 30 June 2023 (a public copy republished by DDTM de l''Eure). Since June 2026 RTE
    publishes its list of lines on ODRÉ without coordinates, citing public security: "RTE a fait évoluer l''accès
    aux données GPS des infrastructures du réseau public de transport pour des raisons de sécurité publique" (ODRÉ,
    Lignes aériennes RTE, https://odre.opendatasoft.com/explore/dataset/lignes-aeriennes-rte-nv/). The project therefore
    publishes only region and department totals and does not publish line segments.'
  - 'Substations are not included: the project does not collect their locations.'
  - Lines with an administrative approval that are not yet built (état ACCORD ADMINISTRATIF; 159 segments, 1,467.5
    km) are not included.
  - Lines recorded as de-energized (hors tension; 1,882 km) are counted in km_unknown, without a voltage.
  - Regions are merged from the Natural Earth 1:10m department outlines used by the department layer, so region
    values equal the sum of their department values. A line within about a kilometer of a region boundary may be
    counted in the neighboring region. 793.5 km of line lie outside the 12 covered regions (coast and international
    connections) and are not counted.
  - The layer does not show how much power can flow into a region.
