# Config of the boundaries dataset (SPEC_META_publish_v0_1 section 4.2). Built from the output of CODE-BND.
layer_id: abf_boundaries
title: "Administrative boundaries · ADM0, ADM1, ADM2"
title_ru: "Административные границы · ADM0, ADM1, ADM2"
description: >-
  Administrative units of the world: countries (ADM0) everywhere, first-level units (ADM1) for 108
  countries and second-level units (ADM2) for the United States, France and Norway, in the countries
  whose entry in the boundary registry has been verified. Every unit has a code unit_id: ISO3 for
  countries, ISO3-level-national code below them (for example USA-2-51059 or POL-1-24). Units carry
  the geometry used on the map; for the United States and Norway, the national geometry used for
  calculations is published in separate analysis files. Boundaries follow the U.S. government's
  point of view and do not express a position of the project. Areas where the state in control
  differs from the state shown are listed in the contested_areas layer, with both states, the date
  and sources. Areas that the chosen point of view assigns to no country are a separate layer.
  Changes from 0.1.0: ADM1 added for 104 countries (1,578 units) by the top level of ISO 3166-2 in
  Unicode CLDR release-48-2, with documented corrections; Adjara added to the ADM0 unit of Georgia
  (GEO), which Natural Earth 1:10m v5.1.2 (U.S. point of view) left uncovered; six French region and
  department names aligned with the official geographic code of INSEE (COG); new layer
  contested_areas.
license: {id: CC-BY-4.0, name: Creative Commons Attribution 4.0 International, url: "https://creativecommons.org/licenses/by/4.0/", family: attribution, attribution_text: ""}
published_columns:
  adm0: [unit_id, iso3, level, parent_id, name, unit_type_local, unit_type_en, method, source, source_vintage, license, boundary_vintage, src_ref, adm0_status, ne_type]
  adm1: [unit_id, iso3, level, parent_id, name, unit_type_local, unit_type_en, method, source, source_vintage, license, boundary_vintage, src_ref]
  adm2: [unit_id, iso3, level, parent_id, name, unit_type_local, unit_type_en, method, source, source_vintage, license, boundary_vintage, src_ref]
  disputed_unassigned: [unit_id, label, area_km2, pov]
  contested_areas: [area_id, name, controlled_by, claimed_by, control_since, label, frame_unit_ids, source_control, source_claim, checked_at, checked_by]
fields:
  - {name: unit_id, type: string, nullable: false, description: "Unit code: ISO3 for countries, ISO3-level-national code below them, for example USA-2-51059."}
  - {name: iso3, type: string, nullable: false, description: "ISO 3166-1 alpha-3 code of the country."}
  - {name: level, type: string, nullable: false, description: "Administrative level of the unit: ADM0 (country), ADM1 or ADM2."}
  - {name: parent_id, type: string, nullable: true, null_meaning: "The unit is a country and has no parent.", description: "unit_id of the unit one level up."}
  - {name: name, type: string, nullable: false, description: "Name of the unit: for first-level units added in version 0.2.0, the English name of the code in Unicode CLDR where CLDR has one, otherwise the name in Natural Earth; in France, the name in the official geographic code of INSEE; elsewhere, as given by the source. For a contested area, its English name."}
  - {name: unit_type_local, type: string, nullable: true, null_meaning: "The source gives no local type of the unit.", description: "Type of the unit in the national language, for example county or commune."}
  - {name: unit_type_en, type: string, nullable: true, null_meaning: "The source gives no type of the unit.", description: "Type of the unit in English."}
  - {name: method, type: string, nullable: true, null_meaning: "Not applicable to the unit.", description: "How the unit was made: taken as it is from the source, dissolved from smaller units, or conformed to a national list."}
  - {name: source, type: string, nullable: false, description: "Publisher or product the unit comes from."}
  - {name: source_vintage, type: string, nullable: true, null_meaning: "The source gives no edition.", description: "Edition or date of the source."}
  - {name: license, type: string, nullable: false, description: "License of the source of the unit."}
  - {name: boundary_vintage, type: string, nullable: true, null_meaning: "The source gives no edition.", description: "Date or year of the boundaries."}
  - {name: src_ref, type: string, nullable: true, null_meaning: "The source gives no reference code.", description: "Reference of the unit in the source, for example its original code."}
  - {name: adm0_status, type: string, nullable: true, null_meaning: "Not applicable to the unit.", description: "Status of the country record, as set by the project's rules for disputed territories."}
  - {name: ne_type, type: string, nullable: true, null_meaning: "Not applicable to the unit.", description: "Type of the country record in Natural Earth."}
  - {name: label, type: string, nullable: true, null_meaning: "Not applicable to the unit.", description: "Label of the area: the name of a disputed or unassigned area; for a contested area, the map caption with the state in control, the claiming state and the date."}
  - {name: area_km2, type: number, unit: km2, nullable: true, null_meaning: "Not applicable to the unit.", description: "Area of the disputed or unassigned area."}
  - {name: pov, type: string, nullable: true, null_meaning: "Not applicable to the unit.", description: "Point of view under which the area is drawn."}
  - {name: area_id, type: string, nullable: false, description: "Code of the contested area, for example CA-0001. It does not change between versions."}
  - {name: frame_unit_ids, type: string, nullable: false, description: "unit_id of the units of the frame that make up the contested area, separated by semicolons."}
  - {name: controlled_by, type: string, nullable: false, description: "ISO 3166-1 alpha-3 code of the state in control of the area; several codes are separated by semicolons."}
  - {name: claimed_by, type: string, nullable: false, description: "ISO 3166-1 alpha-3 code of the state that claims the area; several codes are separated by semicolons."}
  - {name: control_since, type: string, nullable: false, description: "Year and month, or date, from which the state in control has controlled the area."}
  - {name: source_control, type: string, nullable: false, description: "Addresses of the documents on the control of the area, separated by semicolons."}
  - {name: source_claim, type: string, nullable: false, description: "Addresses of the documents on the claim to the area, separated by semicolons."}
  - {name: checked_at, type: string, nullable: false, description: "Date the sources of the row were checked."}
  - {name: checked_by, type: string, nullable: false, description: "Who checked the sources: human, script or AI agent with its role (human:…, script:…, agent:…)."}
