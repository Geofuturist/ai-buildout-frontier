coverage:
  geography: "World (ADM0); ADM1 for 108 countries and ADM2 for the United States, France and Norway, the countries with a verified entry in the boundary registry"
  known_gaps:
    - >-
      Ten areas, about 487 km² together, belong to a country but to none of its first-level units,
      because Natural Earth gives them no code of the reference list: six in Australia (Jervis Bay
      Territory, Christmas Island, the Cocos (Keeling) Islands, Macquarie Island, Ashmore and
      Cartier Islands, the Coral Sea Islands), two in the United Arab Emirates, one in Russia and
      one in Venezuela. They are listed with their areas in adm1_leftovers.csv. Macquarie Island is
      left out of Tasmania (AUS-1-TAS) until it is checked against a document of the state.
    - >-
      Thirteen small areas of land in the Natural Earth admin-1 file, from 1 to 45 km² each and
      about 289 km² together, are covered by no ADM0 unit and are not in the layer of unassigned
      areas either. Most are coastal edges and small islands where the admin-1 and admin-0 files of
      Natural Earth are drawn differently; one is the Paracel Islands (5 km²). They are listed in
      validation_report.json.
    - >-
      ADM1 follows the top level of ISO 3166-2 as recorded in Unicode CLDR release-48-2; reforms
      after that release may not be reflected.
    - >-
      First-level units are cut to the outline of their country. Where Natural Earth draws a
      first-level unit beyond that outline, the part outside is left out; the largest is 2,268 km²
      of Ladakh (IND-1-LA) inside the outline of China in the U.S. point of view. All such losses
      are listed in validation_report.json.
    - >-
      ADM1 units exist only for countries whose registry entry has been verified (108 in this
      release); ADM2 units exist for the United States, France and Norway. The other 134 countries
      and territories have ADM0 only.
    - >-
      First-level units outside the United States and Norway, and the departments of France, are
      built from Natural Earth 1:10m units. They are generalized and are not the official national
      boundaries.
    - >-
      Disputed and unassigned areas are not part of any country.
    - >-
      The contested_areas layer lists only areas whose control has been checked against sources:
      Crimea and Sevastopol in this release. It is made of whole units of the frame, so areas where
      control covers only part of a unit, such as areas of eastern and southern Ukraine since 2022,
      are not listed.
verification:
  levels: {source_as_is: 0.0, script_rules: 1.0, human: 0.0}
  method: >-
    Units are built by script from the sources by the method named in the registry; the registry
    marks a country and level as verified before its units are published. For the first-level units
    added in version 0.2.0, the code list of each country was matched to Unicode CLDR release-48-2
    by script, and a random sample of countries, together with every country whose units were
    merged, matched by name or left with parts outside any unit, was checked against official
    national lists by an independent AI agent. The verification sample covers countries whose
    official lists could be retrieved. The validation report of the build is published next to the
    units.
  sample_share: {}   # the build adds sample_share and levels.agent_sample from the registry
