freshness: {source_cadence: irregular, next_check: "2027-03-31"}
coverage:
  geography: "World (ADM0); ADM1 and ADM2 for the countries with a verified entry in the boundary registry"
  known_gaps:
    - "ADM1 and ADM2 exist only for the countries listed in the registry (ADM1: USA, FRA, GBR, NOR; ADM2: USA, FRA, NOR)."
    - "Disputed and unassigned areas are not part of any country."
verification:
  levels: {source_as_is: 0.0, script_rules: 1.0, human: 0.0}
  method: >-
    Units are built by script from the sources by the method named in the registry; the registry
    marks a country and level as verified before its units are published. The validation report
    of the build is published next to the units.
  sample_share: {}
display:
  geometry_type: polygon
  legend_title: "Administrative boundaries"
  tile_fields_by_layer:
    adm0: [unit_id, name, iso3, level, adm0_status]
    adm1: [unit_id, name, iso3, level]
    adm2: [unit_id, name, iso3, level]
    disputed_unassigned: [unit_id, label]
tiles:
  minzoom: 0
  maxzoom: 10
  extra_args: ["--detect-shared-borders", "--no-tile-size-limit", "--no-feature-limit"]
  layers:
    adm0: {minzoom: 0, maxzoom: 10}
    adm1: {minzoom: 2, maxzoom: 10}
    adm2: {minzoom: 4, maxzoom: 10}
    disputed_unassigned: {minzoom: 0, maxzoom: 10}
citation:
  text: "AI Buildout Frontier. {title}. Version {version}, {year}. {doi_url}"
  record_pattern: "AI Buildout Frontier, boundaries, unit {record_key}, version {version}. {doi_url}"
