layer_id: dc_icpe_georisques
title: Data centers · classified installations (ICPE), Géorisques · points
title_ru: ЦОД · классифицированные установки (ICPE), Géorisques · точки
domain: dc
level: point
input:
  table: data\fra\layer_icpe_georisques_20261010.csv
  legacy_meta: data\fra\layer_icpe_georisques_20261010_meta.json
description: 'Data centers that appear in France''s register of installations classified for environmental
  protection (ICPE), as published by Géorisques, with the commune and a link to the register card of each
  installation. Presence in the register is a fact about the register: it is not a statement about the
  size of the site, and data centers below the register thresholds are not in it at all.'
fields:
- name: record_id
  type: string
  nullable: false
  description: AIOT number of the installation in the register, kept as a string with leading zeros.
- name: name_public
  type: string
  description: Name of the installation or of its operator as recorded in the register.
  nullable: false
- name: commune_insee
  type: string
  description: INSEE code of the commune of the installation.
  nullable: false
- name: unit_id
  type: string
  description: Department of the installation, see abf-boundaries.
  nullable: false
- name: naf_code
  type: string
  nullable: true
  description: Division of the French activity classification (NAF) recorded in the register, two digits.
  null_meaning: The register gives no activity code for the installation.
- name: selection_rule
  type: string
  nullable: false
  description: 'Rule that selected the record: name (the name in the register contains a data-center term,
    such as data center or centre de données); operator_list (the operator is on the project''s list of
    data-center operators; for operators with other lines of business, only when the name also points
    to a data center); site_list (the site is named as a data center in a public document of its operator).'
- name: lon
  type: number
  nullable: true
  description: Longitude as published in the register (WGS 84).
  null_meaning: The register gives no usable coordinates for the installation.
- name: lat
  type: number
  nullable: true
  description: Latitude as published in the register (WGS 84).
  null_meaning: The register gives no usable coordinates for the installation.
- name: coord_source
  type: string
  description: 'Origin of the point: georisques, the register itself.'
  nullable: false
- name: coord_precision
  type: string
  description: 'Precision of the point. city for all records: the register does not state the precision
    of its coordinates.'
  nullable: false
- name: ref
  type: string
  description: Address of the register card of the installation on Géorisques.
  nullable: false
- name: checked_at
  type: date
  description: Date and time of the build that set the record.
  nullable: false
- name: checked_by
  type: string
  description: Script that selected the record; the independent agent check is in the verification log.
  nullable: false
sources:
- source_id: georisques_icpe
  role: primary
  publisher: Ministère de la Transition écologique — Géorisques
  product: Installations classées pour la protection de l'environnement (ICPE)
  url: https://www.georisques.gouv.fr/donnees/bases-de-donnees/installations-industrielles
  edition: extract 2026-10-10
  publication_mode: open_licence
  license:
    id: etalab-2.0
    name: Licence Ouverte v2.0
    family: attribution
    attribution_text: 'Data centers: Géorisques, Installations classées pour la protection de l''environnement
      (ICPE), extract downloaded 10/10/2026, Licence Ouverte v2.0 (Etalab).'
    url: https://www.etalab.gouv.fr/wp-content/uploads/2017/04/ETALAB-Licence-Ouverte-v2.0.pdf
  rights_basis:
    type: license
    checked_by: human:V
    text: The Géorisques site states that, unless otherwise indicated, all its content is under Licence
      Ouverte 2.0 (etalab-2.0); the ICPE download page states no other terms.
    checked_at: '2026-10-10'
