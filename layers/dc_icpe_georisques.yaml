  current_through: '2026-10-10'
verification:
  levels:
    source_as_is: 0.0
    script_rules: 1.0
    human: 0.0
    agent_sample: 1.0
  method: 'Candidates are selected by script rules (name, operator list, site list). Every candidate was
    checked by an independent agent against the register card and a public source, and only confirmed
    records are published. A record is confirmed when the operator publicly states a data center in the
    same commune and the address matches, or the operator has a single site there, or the register name
    itself says data center. Missed data centers are checked on a random sample of the records the final
    rules leave out among those with NAF division 62 or 63 or an operator with other lines of business:
    16 of these 193 records were checked.'
  sample_share:
    candidates: 1.0
    rejected: 0.0829
freshness:
  source_cadence: irregular
  next_check: 2027-04-30
coverage:
  geography: France (101 departments)
  iso3: [FRA]
  known_gaps:
  - Data centers are selected from the register by name, by a list of data-center operators, and by a
    list of sites named in public operator documents. Every selected record was checked by an independent
    agent against the register card and a public source; three records could not be confirmed and are
    not in the layer.
  - Two random samples of 10 records left out by the rules were checked for missed data centers. They
    found 3 and then 1, and the rules were extended to include them. The final rules leave out 193 records
    that could plausibly be data centers (NAF division 62 or 63, or an operator with other lines of business);
    16 of them were checked and 177 were not. Based on the second sample, between 1.8% and 40.4% (95%
    interval) of those 177, roughly 3 to 72 records, may be data centers. Six records of that sample could
    not be settled, so this is a low estimate. The layer is a lower bound of the data centers in the register.
  - The register extract gives no status of the installation and no precision of the coordinates, so all
    points are shown at commune precision. For one listed installation (Digital Realty MRS3, Marseille)
    the register card shows "en fin d'exploitation".
  - Activity codes in the extract are two-digit NAF divisions, so the code 63.11Z (data processing and
    hosting) cannot be used to select data centers.
  - Classification headings (rubriques), the regime of the installation and its equipment are deliberately
    not published.
display:
  geometry_type: point
  home_bbox_from:      # SPEC_META 6 item 23: mainland France with Corsica (01-95, 2A, 2B); overseas departments stay in the data
    iso3: FRA
    level: ADM2
    code_regex: '0[1-9]|[1-8][0-9]|9[0-5]|2A|2B'
  legend_title: Precision of the point
  tile_fields:
  - record_id
  - name_public
  - unit_id
  - commune_insee
  - coord_precision
  - ref
ref_field: ref
unit_check:
  iso3: FRA
  level: ADM2
geometry:
  lon: lon
  lat: lat
  precision: coord_precision
  bounds:
  - -5.5
  - 41.0
  - 10.0
  - 51.5
  precisions:
  - site
  - city
  - none
tiles:
  minzoom: 0
  maxzoom: 12
